<script>
(async function () {
  "use strict";
  const sourceURLs = ["https://raw.githubusercontent.com/klarakonik80-ship-it/stajnia-siemowo/88efd0589a974d8bca1a9356a6381889feae07e0/index.html", "https://cdn.jsdelivr.net/gh/klarakonik80-ship-it/stajnia-siemowo@88efd0589a974d8bca1a9356a6381889feae07e0/index.html"];
  const voiceModule = "/* Stajnia Siemowo \u2014 bezpieczny most pomi\u0119dzy rozmow\u0105 AI a istniej\u0105cym managerem.\n * Do\u0142\u0105cz po g\u0142\u00f3wnym skrypcie istniej\u0105cej aplikacji. Klucz API nigdy nie jest tu przechowywany.\n * Wersja pr\u00f3bna: zapisy wy\u0142\u0105cznie po klikni\u0119ciu POTWIERDZAM, nie samym poleceniu modelu.\n */\n(() => {\n  'use strict';\n  if (document.getElementById('siemowoAiButton')) return;\n  const WORKER = 'https://stajnia-siemowo-ai.klarakonik80.workers.dev';\n  const id = x => document.getElementById(x);\n  const normalize = x => String(x || '').toLocaleLowerCase('pl-PL').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/\u0142/g,'l').replace(/[^a-z0-9 ]/g,' ').replace(/\\s+/g,' ').trim();\n  const tell = x => {id('siemowoAiStatus').textContent=x;};\n  const cleanText = x => String(x||'').trim().slice(0,400);\n  const syncReady = () => navigator.onLine && !hasPending() && id('syncDot')?.classList.contains('ok');\n  let pc=null, stream=null, dc=null, timer=null, pending=null, busy=false;\n  const processed = new Set();\n  const theme=document.createElement('style');\n  theme.textContent=`#siemowoAiButton{background:#14532d;color:#fff;border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:700}#siemowoAiPanel{display:none;position:fixed;z-index:9999;right:12px;bottom:12px;width:min(430px,calc(100vw - 24px));max-height:90vh;overflow:auto;border-radius:18px;box-shadow:0 8px 60px #0006;border:1px solid #d1d5db;background:#fff;padding:17px;color:#1b3326;font-size:15px}#siemowoAiPanel button{cursor:pointer;border:0;border-radius:10px;padding:11px 12px;background:#166534;color:#fff}#siemowoAiPanel button:disabled{opacity:.5;cursor:not-allowed}#siemowoAiPanel input:not([type=checkbox]){width:100%;padding:12px;border-radius:9px;border:1px solid #bbb;min-width:0;font-size:15px}#siemowoAiPanel .airow{display:flex;gap:8px;margin:9px 0}#siemowoAiPanel .airow button{flex:1}#siemowoAiPanel p{line-height:1.5}#siemowoAiPending{display:none;background:#fff8e7;border:1px solid #e8cf96;border-radius:12px;padding:12px;white-space:pre-line}#siemowoAiStatus{background:#f1f5f9;border-radius:10px;padding:12px;white-space:pre-line}#siemowoAiLog{max-height:90px;overflow:auto;font-size:13px;color:#555;white-space:pre-wrap}#siemowoAiPanel .secondary{background:#64748b}`;\n  document.head.appendChild(theme);\n  const btn=document.createElement('button');btn.id='siemowoAiButton';btn.textContent='\ud83c\udf99\ufe0f Hej, Stajnia AI';\n  (document.querySelector('header .sync')||document.querySelector('header')||document.body).appendChild(btn);\n  const panel=document.createElement('aside');panel.id='siemowoAiPanel';\n  panel.innerHTML=`<div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\"><strong style=\"font-size:20px\">\ud83d\udc34 Hej, Stajnia! AI</strong><button class=\"secondary\" id=\"siemowoAiClose\" aria-label=\"Zamknij\">\u2715</button></div><p>Rozmawiaj g\u0142osem, przegl\u0105daj wszystkie dzia\u0142y i przygotowuj nowych je\u017ad\u017ac\u00f3w, karnety i sta\u0142e grupy do grafiku. <b>\u017badna zmiana nie zapisze si\u0119 bez Twojego potwierdzenia na ekranie.</b></p><label for=\"siemowoAiSecret\">Prywatne has\u0142o Cloudflare</label><input type=\"password\" id=\"siemowoAiSecret\" autocomplete=\"off\" spellcheck=\"false\"><div class=\"airow\"><button id=\"siemowoAiStart\">\ud83c\udf99\ufe0f Rozpocznij rozmow\u0119</button><button id=\"siemowoAiStop\" class=\"secondary\" disabled>\u23f9 Zako\u0144cz</button></div><div id=\"siemowoAiStatus\" role=\"status\" aria-live=\"polite\">Gotowe. Sprawd\u017a, czy grafik jest zsynchronizowany.</div><audio id=\"siemowoAiAudio\" autoplay playsinline controls style=\"width:100%;margin-top:10px\"></audio><div class=\"airow\"><input id=\"siemowoAiText\" placeholder=\"Lub napisz polecenie\u2026\" maxlength=\"400\"><button id=\"siemowoAiSend\" style=\"flex:0 0 auto\" disabled>Wy\u015blij</button></div><div id=\"siemowoAiPending\" role=\"status\"></div><label style=\"display:flex;align-items:center;gap:8px;font-size:13px;margin-top:12px\"><input id=\"siemowoAiEnableWrites\" type=\"checkbox\" style=\"width:auto;min-width:18px;height:18px;flex:0 0 auto\"><span>W\u0142\u0105cz prawdziwe zapisy do programu (domy\u015blnie wy\u0142\u0105czone)</span></label><div class=\"airow\"><button id=\"siemowoAiConfirm\" style=\"display:none;background:#166534\">\u2705 Potwierdzam zapis</button><button id=\"siemowoAiCancel\" class=\"secondary\" style=\"display:none\">Anuluj</button></div><div id=\"siemowoAiLog\"></div><p style=\"color:#64748b;font-size:12px\">Nie wpisuj tutaj klucza OpenAI. Has\u0142o nie jest zapisywane w przegl\u0105darce. Rozmowy mog\u0105 nalicza\u0107 op\u0142aty API. Pr\u00f3ba trwa maks. 3 minuty.</p>`;\n  document.body.appendChild(panel);\n  const log = x => {const d=document.createElement('div');d.textContent=x;id('siemowoAiLog').appendChild(d);while(id('siemowoAiLog').children.length>8)id('siemowoAiLog').firstChild.remove();};\n  function stop(){if(timer){clearTimeout(timer);timer=null;}if(dc){try{dc.close()}catch(_){ }dc=null;}if(pc){try{pc.close()}catch(_){ }pc=null;}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}id('siemowoAiAudio').srcObject=null;busy=false;id('siemowoAiStart').disabled=false;id('siemowoAiStop').disabled=true;id('siemowoAiSend').disabled=true;}\n  function send(event){if(dc?.readyState==='open')dc.send(JSON.stringify(event));}\n  function sayToAi(s){send({type:'conversation.item.create',item:{type:'message',role:'user',content:[{type:'input_text',text:s}]}});send({type:'response.create'});}\n  function showPending(){let box=id('siemowoAiPending');if(!pending){box.style.display='none';id('siemowoAiConfirm').style.display='none';id('siemowoAiCancel').style.display='none';return;}box.textContent=pending.description+'\\nZatwierd\u017a tylko po sprawdzeniu szczeg\u00f3\u0142\u00f3w.';box.style.display='block';id('siemowoAiConfirm').style.display='';id('siemowoAiCancel').style.display='';}\n  const props=(p,required=[])=>({type:'object',properties:p,required,additionalProperties:false});\n  const tools=[\n    {type:'function',name:'znajdz_w_stajni',description:'Wyszukuje je\u017ad\u017ac\u00f3w, konie lub instruktor\u00f3w po nazwie w aktualnie wczytanym grafiku. Nie pobiera telefon\u00f3w.',parameters:props({kategoria:{type:'string',enum:['jezdzcy','konie','instruktorzy']},fraza:{type:'string'}},['kategoria','fraza'])},\n    {type:'function',name:'sprawdz_grafik',description:'Zwraca jazdy zaplanowane w danym dniu, opcjonalnie o konkretnej godzinie.',parameters:props({data:{type:'string',description:'YYYY-MM-DD'},godzina:{type:'string',description:'HH:MM lub pusty ci\u0105g'}},['data'])},\n    {type:'function',name:'pozostale_karnety',description:'Sprawdza aktywne karnety konkretnego je\u017ad\u017aca.',parameters:props({jezdziec:{type:'string'}},['jezdziec'])},\n    {type:'function',name:'przygotuj_jazde',description:'Tylko przygotowuje propozycj\u0119 jazdy; NIE zapisuje jej bez zatwierdzenia przez w\u0142a\u015bcicielk\u0119 w aplikacji.',parameters:props({data:{type:'string',description:'YYYY-MM-DD'},godzina:{type:'string',description:'HH:MM'},jezdziec:{type:'string'},kon:{type:'string'},instruktor:{type:'string'},rodzaj:{type:'string',enum:['indywidualna','grupowa','lonza','oprowadzanka','hipoterapia','sport']}},['data','godzina','jezdziec','kon','instruktor'])},\n    {type:'function',name:'przygotuj_jezdzca',description:'Przygotowuje nowego je\u017ad\u017aca bez zapisu; wymaga klikni\u0119cia potwierdzenia.',parameters:props({imie_nazwisko:{type:'string'},poziom:{type:'string'},telefon:{type:'string',description:'Opcjonalny numer telefonu'}},['imie_nazwisko'])}\n  ];\n  tools.push(\n    {type:'function',name:'sprawdz_stale_grupy',description:'ODCZYT STA\u0141YCH GRUP z zak\u0142adki Grupy, niezale\u017cnie od grafiku. Cz\u0142onkowie, dni, godziny i instruktorzy.',parameters:props({dzien:{type:'string',description:'Nazwa dnia tygodnia lub wszystkie'}},['dzien'])},\n    {type:'function',name:'przegladaj_dane_stajni',description:'Odczytuje wszystkie dzia\u0142y: podsumowanie, je\u017ad\u017acy, konie, instruktorzy, grupy, karnety, jazdy, cennik i kontakt pojedynczego je\u017ad\u017aca. Nie zmienia danych.',parameters:props({kategoria:{type:'string',enum:['podsumowanie','jezdzcy','konie','instruktorzy','grupy','karnety','jazdy','cennik','kontakt']},fraza:{type:'string',description:'Opcjonalna nazwa, data lub imi\u0119 i nazwisko; wymagane przy kontakcie'},strona:{type:'integer',description:'Numer strony wynik\u00f3w'}},['kategoria'])},\n    {type:'function',name:'przygotuj_karnet',description:'Przygotuj nowy karnet na 4 lub 5 jazd zgodnie z aplikacj\u0105. Zapytaj o cen\u0119, daty wa\u017cno\u015bci i stan p\u0142atno\u015bci. Bez potwierdzenia na ekranie nic nie zapisuj.',parameters:props({jezdziec:{type:'string'},liczba_jazd:{type:'integer',enum:[4,5]},cena:{type:'number'},data_od:{type:'string',description:'YYYY-MM-DD'},data_do:{type:'string',description:'YYYY-MM-DD'},platnosc:{type:'string',enum:['oplacony','do_zaplaty']}},['jezdziec','liczba_jazd','cena','data_od','data_do','platnosc'])},\n    {type:'function',name:'przygotuj_stala_grupe_do_grafiku',description:'Przygotowuje wpisanie istniej\u0105cej sta\u0142ej grupy do grafiku NA JEDEN TERMIN. Przy ka\u017cdej dacie od nowa zapytaj jakiego konia przydzieli\u0107 KA\u017bDEMU obecnemu je\u017ad\u017acowi, bo co tydzie\u0144 maj\u0105 inne konie. Nie kopiuj koni z wcze\u015bniejszych tygodni. Zacznij od pustej tablicy przypisa\u0144, aby pobra\u0107 list\u0119 os\u00f3b. Zapis dopiero po potwierdzeniu na ekranie.',parameters:props({grupa:{type:'string'},data:{type:'string',description:'YYYY-MM-DD'},przypisania:{type:'array',items:props({jezdziec:{type:'string'},kon:{type:'string'}},['jezdziec','kon'])}},['grupa','data','przypisania'])}\n  );\n  function matchUnique(list,q,what){const n=normalize(q);if(!n)return {error:'Nie podano: '+what};let exact=list.filter(x=>normalize(x.name)===n);if(exact.length===1)return {value:exact[0]};const loose=list.filter(x=>normalize(x.name).includes(n));if(loose.length===1)return {value:loose[0]};if(loose.length>1)return {error:'Niejednoznaczne '+what+': '+loose.slice(0,6).map(x=>x.name).join(', ')};return {error:'Nie znaleziono '+what+' \u201e'+cleanText(q)+'\u201d'};}\n  function checkCurrent(){if(!syncReady())return {error:'Brak potwierdzonej synchronizacji z Arkuszem Google. Nie zapisz\u0119 danych, dop\u00f3ki grafik si\u0119 nie zsynchronizuje.'};return null;}\n  function makeRide(a){const c=checkCurrent();if(c)return c;const rider=matchUnique(riders,a.jezdziec,'je\u017ad\u017aca'),horse=matchUnique(horses,a.kon,'konia'),ins=matchUnique(instructors,a.instruktor,'instruktora');for(const x of [rider,horse,ins])if(x.error)return x;const date=String(a.data||''),time=String(a.godzina||'');if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(date)||!/^([01]\\d|2[0-3]):[0-5]\\d$/.test(time))return {error:'Podaj pe\u0142n\u0105 dat\u0119 YYYY-MM-DD i godzin\u0119 HH:MM.'};const d=new Date(date+'T12:00:00');if(!Number.isFinite(d.valueOf())||fmt(d)!==date)return {error:'Nieprawid\u0142owa data'};if(![...id('rideTime').options].some(x=>x.value===time))return {error:'Godzina poza grafikiem. Wybierz pe\u0142n\u0105 godzin\u0119 lub p\u00f3\u0142godzin\u0119 od 07:00 do 20:30.'};if(rides.some(r=>normalizeDate(r.date)===date&&normalizeTime(r.time)===time&&r.horse===horse.value.id&&(r.status||'planned')!=='rescheduled'))return {error:'Ko\u0144 jest ju\u017c zaj\u0119ty w tym terminie.'};if(rides.some(r=>normalizeDate(r.date)===date&&normalizeTime(r.time)===time&&r.rider===rider.value.id&&(r.status||'planned')!=='rescheduled'))return {error:'Je\u017adziec ma ju\u017c jazd\u0119 w tym terminie.'};const kind=['indywidualna','grupowa','lonza','oprowadzanka','hipoterapia','sport'].includes(a.rodzaj)?a.rodzaj:'indywidualna';pending={type:'ride',date,time,riderId:rider.value.id,horseId:horse.value.id,instructorId:ins.value.id,kind,description:`JAZDA: ${rider.value.name}\\nData: ${date}, godz.: ${time}\\nKo\u0144: ${horse.value.name}\\nInstruktor: ${ins.value.name}\\nRodzaj: ${kind}\\nRozliczenie: bez karnetu, wg cennika (${kind==='grupowa'?0:Number(priceSettings[kind]||0)} z\u0142)`};showPending();return {ok:true,informacja:pending.description,instrukcja:'Popro\u015b u\u017cytkowniczk\u0119 o klikni\u0119cie przycisku Potwierdzam zapis. Nie twierd\u017a, \u017ce zapis ju\u017c nast\u0105pi\u0142.'};}\n  function makeRider(a){const c=checkCurrent();if(c)return c;const name=cleanText(a.imie_nazwisko);const phone=cleanText(a.telefon||'');if(phone&&!/^[+0-9 ()-]{7,22}$/.test(phone))return {error:'Nieprawid\u0142owy numer telefonu.'};if(!name||name.split(/\\s+/).length<2)return {error:'Podaj imi\u0119 i nazwisko nowego je\u017ad\u017aca.'};const existing=riders.find(x=>normalize(x.name)===normalize(name));if(existing)return {error:'Je\u017adziec o tym imieniu i nazwisku ju\u017c istnieje.'};pending={type:'rider',name,phone,level:['Pocz\u0105tkuj\u0105cy','\u015aredni','Zaawansowany'].includes(a.poziom)?a.poziom:'Pocz\u0105tkuj\u0105cy',description:`NOWY JE\u0179DZIEC: ${name}\\nPoziom: ${['Pocz\u0105tkuj\u0105cy','\u015aredni','Zaawansowany'].includes(a.poziom)?a.poziom:'Pocz\u0105tkuj\u0105cy'}\\nTelefon: ${phone||'nie podano'}`};showPending();return {ok:true,informacja:pending.description,instrukcja:'Popro\u015b o klikni\u0119cie Potwierdzam zapis. Nie twierd\u017a, \u017ce zapis ju\u017c nast\u0105pi\u0142.'};}\n\n  const AI_DAYS=['Niedziela','Poniedzia\u0142ek','Wtorek','\u015aroda','Czwartek','Pi\u0105tek','Sobota'];\n  const AI_DAY_NUMBER={niedziela:0,poniedzialek:1,wtorek:2,sroda:3,czwartek:4,piatek:5,sobota:6};\n  const aiValidDate=x=>/^\\d{4}-\\d{2}-\\d{2}$/.test(String(x||''))&&fmt(new Date(x+'T12:00:00'))===x;\n  const aiRiderName=id=>riders.find(x=>x.id===id)?.name||'Nieznany je\u017adziec';\n  const aiHorseName=id=>horses.find(x=>x.id===id)?.name||'Nieznany ko\u0144';\n  const aiInstructorName=id=>instructors.find(x=>x.id===id)?.name||'Nieznany instruktor';\n  function aiGetGroups(a){\n    if(!syncReady())return {error:'Dane nie s\u0105 zsynchronizowane z Arkuszem Google.'};\n    const day=normalize(a.dzien||'wszystkie');\n    const n=Object.prototype.hasOwnProperty.call(AI_DAY_NUMBER,day)?AI_DAY_NUMBER[day]:null;\n    if(n===null&&!['wszystkie','wszystko','all',''].includes(day))return {error:'Nie rozpoznano dnia tygodnia.'};\n    const list=groups.filter(g=>n===null||Number(g.day)===n).slice().sort((a,b)=>((Number(a.day)+6)%7)-((Number(b.day)+6)%7)||normalizeTime(a.time).localeCompare(normalizeTime(b.time)));\n    return {dzien:n===null?'wszystkie':AI_DAYS[n],liczba_grup:list.length,grupy:list.map(g=>({nazwa:g.name,dzien:AI_DAYS[Number(g.day)]||'?',godzina:normalizeTime(g.time),instruktor:aiInstructorName(g.instructor),uczestnicy:(g.members||[]).map(aiRiderName)}))};\n  }\n  function aiBrowse(a){\n    if(!syncReady())return {error:'Dane nie s\u0105 zsynchronizowane z Arkuszem Google.'};\n    const k=a.kategoria,q=normalize(a.fraza||''),page=Math.max(1,Math.min(100,Math.floor(Number(a.strona)||1)));\n    if(k==='podsumowanie')return {jezdzcy:riders.length,konie:horses.length,instruktorzy:instructors.length,stale_grupy:groups.length,karnety_aktywne:passes.filter(p=>passState(p).active).length,karnety_do_zaplaty:passes.filter(p=>(p.paymentStatus||'paid')==='unpaid').length,jazdy:rides.length};\n    if(k==='cennik')return {cennik:{...priceSettings}};\n    if(k==='kontakt'){\n      if(!q)return {error:'Podaj imi\u0119 i nazwisko je\u017ad\u017aca, aby odczyta\u0107 telefon.'};\n      const r=matchUnique(riders,a.fraza,'je\u017ad\u017aca');if(r.error)return r;\n      return {jezdziec:r.value.name,telefon:r.value.phone||'Brak numeru'};\n    }\n    let all=[];\n    if(k==='jezdzcy')all=riders.map(r=>({jezdziec:r.name,poziom:r.level||'',aktywne_karnety:passes.filter(p bDYM kolejnym wpisie sta\u0142ej grupy zapytaj od nowa, jaki ko\u0144 dla kt\u00f3rego je\u017ad\u017aca; nigdy nie zgaduj koni, nie kopiuj z wcze\u015bniejszego tygodnia. Je\u015bli brak danych, dopytaj. Nigdy nie stwierdzaj, \u017ce co\u015b zosta\u0142o zapisane, dop\u00f3ki w\u0142a\u015bcicielka nie zatwierdzi propozycji przyciskiem w aplikacji. Je\u015bli brakuje instruktora, zapytaj. Nie pytaj o has\u0142a ani klucze API.'}});\n        send({type:'response.create',response:{instructions:'Przywitaj si\u0119 po polsku jednym zdaniem i zapytaj, w czym pom\u00f3c.'}});\n      });\n      dc.addEventListener('message',evt=>{try{const ev=JSON.parse(evt.data);if(ev.type==='response.output_item.done'&&ev.item?.type==='function_call')handleCall(ev.item);if(ev.type==='response.done')for(const item of ev.response?.output||[])if(item.type==='function_call')handleCall(item);if(ev.type==='response.output_audio_transcript.done')log('Stajnia: '+String(ev.transcript||'').slice(0,500));if(ev.type==='error')log('AI: '+String(ev.error?.message||'B\u0142\u0105d'));}catch(err){console.warn('AI event',err);}});\n      const offer=await pc.createOffer();await pc.setLocalDescription(offer);const ans=await fetch('https://api.openai.com/v1/realtime/calls',{method:'POST',headers:{Authorization:'Bearer '+token.value,'Content-Type':'application/sdp'},body:offer.sdp});if(!ans.ok)throw new Error('Po\u0142\u0105czenie g\u0142osowe zosta\u0142o odrzucone ('+ans.status+').');await pc.setRemoteDescription({type:'answer',sdp:await ans.text()});\n      timer=setTimeout(()=>{stop();tell('Test zako\u0144czony po 3 minutach, \u017ceby ograniczy\u0107 koszty.');},180000);\n    }catch(err){stop();tell('Nie uda\u0142o si\u0119 po\u0142\u0105czy\u0107: '+String(err?.message||err)+'. Sprawd\u017a, czy serwer Cloudflare ma wgran\u0105 wersj\u0119 obs\u0142uguj\u0105c\u0105 po\u0142\u0105czenie z aplikacji.');}\n  });\n})();\n";
  const cacheKey = "siemowo_manager_original_html_pinned_v1";
  const msg = document.getElementById("loadingMsg");

  async function getOriginal() {
    // SZYBKI START: wykorzystaj zapisany kod bez czekania na sieć.
    // Sieć służy wyłącznie jako awaryjna ścieżka przy pierwszym uruchomieniu.
    try {
      const saved = localStorage.getItem(cacheKey);
      if (saved && saved.includes("function renderAll()") &&
          saved.includes("function saveRide()") &&
          saved.includes("Stajnia Siemowo Manager")) return saved;
    } catch (_) {}
    // Pierwsze uruchomienie: pobierz niezmienną, znaną wersję programu.
    // Nigdy nie pobieraj bieżącego index.html, bo to spowodowałoby zapętlenie.
    for (const url of sourceURLs) {
      try {
        const res = await fetch(url, {cache:"force-cache"});
        if (!res.ok) continue;
        const body = await res.text();
        if (!body.includes("Stajnia Siemowo Manager") ||
            !body.includes("function renderAll()") ||
            !body.includes("function saveRide()")) continue;
        try { localStorage.setItem(cacheKey, body); } catch (_) {}
        return body;
      } catch (_) {}
    }
    try {
      const saved = localStorage.getItem(cacheKey);
      if (saved && saved.includes("function renderAll()")) return saved;
    } catch (_) {}
    throw new Error("Nie udało się wczytać głównego programu. Sprawdź internet i odśwież stronę.");
  }

  try {
    const original = await getOriginal();
    // Rzadsze odświeżanie w tle. Zachowaj synchronizację po zapisaniu zmian
    // i po wznowieniu aplikacji (obsługuje to oryginalny program).
    const optimized = original.replace(
      "setInterval(()=>loadAll(),60000)",
      "setInterval(()=>{if(!document.hidden && navigator.onLine && !hasPending())loadAll()},180000)"
    );
    const endBody = optimized.toLowerCase().lastIndexOf("</body>");
    if (endBody === -1) throw new Error("Brak znacznika końca strony w programie.");
    const safeModule = voiceModule.replace(/<\/script/gi, "<\\/script");
    const scriptTag = "<scr" + "ipt>" + safeModule + "</scr" + "ipt>";
    const combined = optimized.slice(0,endBody) + "\n" + scriptTag + "\n" + optimized.slice(endBody);
    document.open();
    document.write(combined);
    document.close();
  } catch (error) {
    msg.textContent = error.message || "Błąd ładowania aplikacji.";
    msg.style.color = "#b91c1c";
    const btn = document.createElement("button");
    btn.textContent = "Spróbuj ponownie";
    btn.onclick = () => location.reload();
    msg.after(btn);
  }
})();
