(async function () {

  const sourceURLs = ["https://raw.githubusercontent.com/klarakonik80-ship-it/stajnia-siemowo/88efd0589a974d8bca1a9356a6381889feae07e0/index.html", "https://cdn.jsdelivr.net/gh/klarakonik80-ship-it/stajnia-siemowo@88efd0589a974d8bca1a9356a6381889feae07e0/index.html"];
  const voiceModule = "/* Stajnia Siemowo \u2014 bezpieczny most pomi\u0119dzy rozmow\u0105 AI a istniej\u0105cym managerem.\n * Do\u0142\u0105cz po g\u0142\u00f3wnym skrypcie istniej\u0105cej aplikacji. Klucz API nigdy nie jest tu przechowywany.\n * Wersja pr\u00f3bna: zapisy wy\u0142\u0105cznie po klikni\u0119ciu POTWIERDZAM, nie samym poleceniu modelu.\n */\n(() => {\n  'use strict';\n  if (document.getElementById('siemowoAiButton')) return;\n  const WORKER = 'https://stajnia-siemowo-ai.klarakonik80.workers.dev';\n  const id = x => document.getElementById(x);\n  const normalize = x => String(x || '').toLocaleLowerCase('pl-PL').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/\u0142/g,'l').replace(/[^a-z0-9 ]/g,' ').replace(/\\s+/g,' ').trim();\n  const tell = x => {id('siemowoAiStatus').textContent=x;};\n  const cleanText = x => String(x||'').trim().slice(0,400);\n  const syncReady = () => navigator.onLine && !hasPending() && id('syncDot')?.classList.contains('ok');\n  let pc=null, stream=null, dc=null, timer=null, pending=null, busy=false;\n  const processed = new Set();\n  const handledResponses = new Set();\n  const aiSessionSecretKey = 'stajnia_ai_access_session_v1';\n  let playbackActive=false;\n  function micOn(on){if(stream)for(const track of stream.getAudioTracks())track.enabled=!!on;}\n\n  const currentHorseNames=()=>horses.map(h=>String(h.name||'').trim()).filter(Boolean).slice(0,140);\n  const theme=document.createElement('style');\n  theme.textContent=`#siemowoAiButton{background:#14532d;color:#fff;border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:700}#siemowoAiPanel{display:none;position:fixed;z-index:9999;right:12px;bottom:12px;width:min(430px,calc(100vw - 24px));max-height:90vh;overflow:auto;border-radius:18px;box-shadow:0 8px 60px #0006;border:1px solid #d1d5db;background:#fff;padding:17px;color:#1b3326;font-size:15px}#siemowoAiPanel button{cursor:pointer;border:0;border-radius:10px;padding:11px 12px;background:#1 type=\"button\" style=\"font-size:12px;padding:7px\">Zapomnij has\u0142o</button></div><label for=\"siemowoAiVoice\">G\u0142os asystentki</label><select id=\"siemowoAiVoice\" style=\"width:100%;padding:9px;border-radius:9px;margin-top:4px\"><option value=\"shimmer\">Shimmer \u2014 \u0142agodniejszy</option><option value=\"coral\">Coral \u2014 wyra\u017any</option><option value=\"marin\">Marin \u2014 poprzedni</option><option value=\"sage\">Sage \u2014 spokojny</option></select><div class=\"airow\"><button id=\"siemowoAiStart\">\ud83c\udf99\ufe0f Rozpocznij rozmow\u0119</button><button id=\"siemowoAiStop\" class=\"secondary\" disabled>\u23f9 Zako\u0144cz</button></div><div id=\"siemowoAiStatus\" role=\"status\" aria-live=\"polite\">Gotowe. Sprawd\u017a, czy grafik jest zsynchronizowany.</div><audio id=\"siemowoAiAudio\" autoplay playsinline controls style=\"width:100%;margin-top:10px\"></audio><div class=\"airow\"><input id=\"siemowoAiText\" placeholder=\"Lub napisz polecenie\u2026\" maxlength=\"400\"><button id=\"siemowoAiSend\" style=\"flex:0 0 auto\" disabled>Wy\u015blij</button></div><div id=\"siemowoAiPending\" role=\"status\"></div><label style=\"display:flex;align-items:center;gap:8px;font-size:13px;margin-top:12px\"><input id=\"siemowoAiEnableWrites\" type=\"checkbox\" style=\"width:auto;min-width:18px;height:18px;flex:0 0 auto\"><span>W\u0142\u0105cz prawdziwe zapisy do programu (domy\u015blnie wy\u0142\u0105czone)</span></label><div class=\"airow\"><button id=\"siemowoAiConfirm\" style=\"display:none;background:#166534\">\u2705 Potwierdzam zapis</button><button id=\"siemowoAiCancel\" class=\"secondary\" style=\"display:none\">Anuluj</button></div><div id=\"siemowoAiLog\"></div><p style=\"color:#64748b;font-size:12px\">Nie wpisuj tutaj klucza OpenAI. Has\u0142o jest pami\u0119tane tylko w bie\u017c\u0105cej karcie, je\u015bli zaznaczysz t\u0119 opcj\u0119; nie jest wysy\u0142ane do GitHub. Rozmowy mog\u0105 nalicza\u0107 op\u0142aty API. Pr\u00f3ba trwa maks. 3 minuty.</p>`;\n  document.body.appendChild(panel);\n  try {const previous=sessionStorage.getItem(aiSessionSecretKey);if(previous)id('siemowoAiSecret').value=previous;}catch(_){ }\n  id('siemowoAiForget').addEventListener('click',()=>{try{sessionStorage.removeItem(aiSessionSecretKey);}catch(_){ }id('siemowoAiSecret').value='';tell('Has\u0142o usuni\u0119te z tej karty.');});\n  id('siemowoAiRemember').addEventListener('change',()=>{if(!id('siemowoAiRemember').checked)try{sessionStorage.removeItem(aiSessionSecretKey);}catch(_){ }});\n\n  const log = x => {const d=document.createElement('div');d.textContent=x;id('siemowoAiLog').appendChild(d);while(id('siemowoAiLog').children.length>8)id('siemowoAiLog').firstChild.remove();};\n  function stop(){playbackActive=false;if(timer){clearTimeout(timer);timer=null;}if(dc){try{dc.close()}catch(_){ }dc=null;}if(pc){try{pc.close()}catch(_){ }pc=null;}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}id('siemowoAiAudio').srcObject=null;busy=false;id('siemowoAiStart').disabled=false;id('siemowoAiStop').disabled=true;id('siemowoAiSend').disabled=true;}\n  function send(event){if(dc?.readyState==='open')dc.send(JSON.stringify(event));}\n  function sayToAi(s){send({type:'conversation.item.create',item:{type:'message',role:'user',content:[{type:'input_text',text:s}]}});send({type:'response.create'});}\n  function horsePreviewText(p){\n    if(p.type==='ride'){\n      const rider=riders.find(r=>r.id===p.riderId)?.name||'Je\u017adziec';\n      const ins=instructors.find(i=>i.id===p.instructorId)?.name||'Instruktor';\n      const horse=horses.find(h=>h.id===p.horseId)?.name||'Nie wybrano';\n      return 'JAZDA: '+rider+'\\nData: '+p.date+', godz.: '+p.time+'\\nKo\u0144: '+horse+'\\nInstruktor: '+ins+'\\nRodzaj: '+p.kind+'\\nRozliczenie: bez karnetu, wg cennika';\n    }\n    if(p.type==='group_schedule'){\n      const g=groups.find(g=>g.id===p.groupId);\n      const instr=instructors.find(i=>i.id===p.instructorId)?.name||'Instruktor';\n      const absent=(g?.members||[]).filter(x=>!p.selected.some(y=>y.riderId===x)).map(x=>riders.find(r=>r.id===x)?.name||'?');\n      return 'STA\u0141A GRUPA DO GRAFIKU\\nGrupa: '+(g?.name||'Grupa')+'\\nData: '+p.date+', godz. '+p.time+'\\nInstruktor: '+instr+'\\n'+p.selected.map(x=>x.riderName+' \u2014 ko\u0144 '+x.horseName).join('\\n')+(absent.length?'\\nNie jad\u0105: '+absent.join(', '):'')+'\\nTylko ten termin. W kolejnym tygodniu ponownie zapytam o konie.';\n    }\n    return p.description;\n  }\n  function showPending(){\n    const box=id('siemowoAiPending');box.replaceChildren();\n    if(!pending){box.style.display='none';id('siemowoAiConfirm').style.display='none';id('siemowoAiCancel').style.display='none';return;}\n    if(['ride','group_schedule'].includes(pending.type))pending.description=horsePreviewText(pending);\n    const summary=document.createElement('div');summary.textContent=pending.description;\n    box.appendChild(summary);\n    if(pending.type==='ride'||pending.type==='group_schedule'){\n      const title=document.createElement('p');title.style.fontWeight='700';title.textContent='\ud83d\udc34 Sprawd\u017a konie przed zapisem. Mo\u017cesz poprawi\u0107 nazw\u0119, wybieraj\u0105c j\u0105 z listy:';box.appendChild(title);\n      const list=pending.type==='ride'?[{riderId:pending.riderId,riderName:riders.find(r=>r.id===pending.riderId)?.name||'Je\u017adziec',horseId:pending.horseId}]:pending.selected;\n      for(const item of list){\n        const label=document.createElement('label');label.style.cssText='display:block;margin:8px 0;font-weight:600';label.textContent=item.riderName;\n        const select=document.createElement('select');select.style.cssText='display:block;width:100%;margin-top:4px;padding:10px;font-size:16px;border:1px solid #aaa;border-radius:8px';\n        const occupied=new Set(rides.filter(r=>normalizeDate(r.date)===pending.date&&normalizeTime(r.time)===pending.time&&(r.status||'planned')!=='rescheduled').map(r=>r.horse).filter(Boolean));\n        for(const h of horses){const option=new Option(h.name+(occupied.has(h.id)?' (zaj\u0119ty)':''),h.id);option.disabled=occupied.has(h.id);select.add(option);}\n        select.value=item.horseId;\n        select.addEventListener('change',()=>{\n          const chosen=horses.find(h=>h.id===select.value);\n          if(!chosen)return;\n          if(pending.type==='group_schedule'&&pending.selected.some(x=>x!==item&&x.horseId===chosen.id)){\n            tell('Ten ko\u0144 zosta\u0142 ju\u017c przypisany innej osobie w grupie. Wybierz innego.');select.value=item.horseId;return;\n          }\n          if(pending.type==='ride')pending.horseId=chosen.id;\n          else {item.horseId=chosen.id;item.horseName=chosen.name;}\n          pending.description=horsePreviewText(pending);summary.textContent=pending.description;\n          tell('Poprawiono konia na: '+chosen.name+'. Jeszcze nic nie zapisano.');\n        });\n        label.appendChild(select);box.appendChild(label);\n      }\n    }\n    const note=document.createElement('div');note.style.marginTop='10px';note.textContent='Zatwierd\u017a dopiero po sprawdzeniu nazw, terminu i uczestnik\u00f3w.';box.appendChild(note);\n    box.style.display='block';id('siemowoAiConfirm').style.display='';id('siemowoAiCancel').style.display='';\n  }\n  const props=(p,required=[])=>({type:'object',properties:p,required,additionalProperties:false});\n  const tools=[\n    {type:'function',name:'znajdz_w_stajni',description:'Wyszukuje dok\u0142adne nazwy koni, je\u017ad\u017ac\u00f3w lub instruktor\u00f3w w bazie. Je\u015bli model ma w\u0105tpliwo\u015bci co do brzmienia imienia konia, najpierw u\u017cyj tego narz\u0119dzia, zanim poprosisz o zapis. Nie pobiera telefon\u00f3w.',parameters:props({kategoria:{type:'string',enum:['jezdzcy','konie','instruktorzy']},fraza:{type:'string'}},['kategoria','fraza'])},\n    {type:'function',name:'sprawdz_grafik',description:'Zwraca jazdy zaplanowane w danym dniu, opcjonalnie o konkretnej godzinie.',parameters:props({data:{type:'string',description:'YYYY-MM-DD'},godzina:{type:'string',description:'HH:MM lub pusty ci\u0105g'}},['data'])},\n    {type:'function',name:'pozostale_karnety',description:'Sprawdza aktywne karnety konkretnego je\u017ad\u017aca.',parameters:props({jezdziec:{type:'string'}},['jezdziec'])},\n    {type:'function',name:'przygotuj_jazde',description:'Tylko przygotowuje propozycj\u0119 jazdy; NIE zapisuje jej bez zatwierdzenia przez w\u0142a\u015bcicielk\u0119 w aplikacji.',parameters:props({data:{type:'string',description:'YYYY-MM-DD'},godzina:{type:'string',description:'HH:MM'},jezdziec:{type:'string'},kon:{type:'string'},instruktor:{type:'string'},rodzaj:{type:'string',enum:['indywidualna','grupowa','lonza','oprowadzanka','hipoterapia','sport']}},['data','godzina','jezdziec','kon','instruktor'])},\n    {type:'function',name:'przygotuj_jezdzca',description:'Przygotowuje nowego je\u017ad\u017aca bez zapisu; wymaga klikni\u0119cia potwierdzenia.',parameters:props({imie_nazwisko:{type:'string'},poziom:{type:'string'},telefon:{type:'string',description:'Opcjonalny numer telefonu'}},['imie_nazwisko'])}\n  ];\n  tools.push(\n    {type:'function',name:'sprawdz_stale_grupy',description:'ODCZYT STA\u0141YCH GRUP z zak\u0142adki Grupy, niezale\u017cnie od grafiku. Cz\u0142onkowie, dni, godziny i instruktorzy.',parameters:props({dzien:{type:'string',description:'Nazwa dnia tygodnia lub wszystkie'}},['dzien'])},\n    {type:'function',name:'przegladaj_dane_stajni',description:'Odczytuje wszystkie dzia\u0142y: podsumowanie, je\u017ad\u017acy, konie, instruktorzy, grupy, karnety, jazdy, cennik i kontakt pojedynczego je\u017ad\u017aca. Nie zmienia danych.',parameters:props({kategoria:{type:'string',enum:['podsumowanie','jezdzcy','konie','instruktorzy','grupy','karnety','jazdy','cennik','kontakt']},fraza:{type:'string',description:'Opcjonalna nazwa, data lub imi\u0119 i nazwisko; wymagane przy kontakcie'},strona:{type:'integer',description:'Numer strony wynik\u00f3w'}},['kategoria'])},\n    {type:'function',name:'przygotuj_karnet',description:'Przygotuj nowy karnet na 4 lub 5 jazd zgodnie z aplikacj\u0105. Zapytaj o cen\u0119, daty wa\u017cno\u015bci i stan p\u0142atno\u015bci. Bez potwierdzenia na ekranie nic nie zapisuj.',parameters:props({jezdziec:{type:'string'},liczba_jazd:{type:'integer',enum:[4,5]},cena:{type:'number'},data_od:{type:'string',description:'YYYY-MM-DD'},data_do:{type:'string',description:'YYYY-MM-DD'},platnosc:{type:'string',enum:['oplacony','do_zaplaty']}},['jezdziec','liczba_jazd','cena','data_od','data_do','platnosc'])},\n    {type:'function',name:'przygotuj_stala_grupe_do_grafiku',description:'Przygotowuje wpisanie istniej\u0105cej sta\u0142ej grupy do grafiku NA JEDEN TERMIN. Przy ka\u017cdej dacie od nowa zapytaj jakiego konia przydzieli\u0107 KA\u017bDEMU obecnemu je\u017ad\u017acowi, bo co tydzie\u0144 maj\u0105 inne konie. Nie kopiuj koni z wcze\u015bniejszych tygodni. Zacznij od pustej tablicy przypisa\u0144, aby pobra\u0107 list\u0119 os\u00f3b. Zapis dopiero po potwierdzeniu na ekranie.',parameters:props({grupa:{type:'string'},data:{type:'string',description:'YYYY-MM-DD'},przypisania:{type:'array',items:props({jezdziec:{type:'string'},kon:{type:'string'}},['jezdziec','kon'])}},['grupa','data','przypisania'])}\n  );\n  function matchUnique(list,q,what){const n=normalize(q);if(!n)return {error:'Nie podano: '+what};let exact=list.filter(x=>normalize(x.name)===n);if(exact.length===1)return {value:exact[0]};const loose=list.filter(x=>normalize(x.name).includes(n));if(loose.length===1)return {value:loose[0]};if(loose.length>1)return {error:'Niejednoznaczne '+what+': '+loose.slice(0,6).map(x=>x.name).join(', ')};return {error:'Nie znaleziono '+what+' \u201e'+cleanText(q)+'\u201d'};}\n\n  // Nazwy koni s\u0105 identyfikatorami z bazy, a nie s\u0142owami do poprawiania przez model.\n  // Przy niepewno\u015bci prosimy o doprecyzowanie; nigdy automatycznie nie wybieramy innego konia.\n  function horseFromCatalog(spoken){\n    const n=normalize(spoken);\n    if(!n)return {error:'Nie us\u0142ysza\u0142am imienia konia. Powiedz je ponownie.'};\n    const exact=horses.filter(h=>normalize(h.name)===n);\n    if(exact.length===1)return {value:exact[0]};\n    function distance(a,b){\n      const v=Array.from({length:b.length+1},(_,i)=>i);\n      for(let i=1;i<=a.length;i++){\n        let prev=v[0];v[0]=i;\n        for(let j=1;j<=b.length;j++){\n          const old=v[j];v[j]=Math.min(v[j]+1,v[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old;\n        }\n      }\n      return v[b.length];\n    }\n    const candidates=horses.map(h=>({name:h.name,d:distance(n,normalize(h.name)),includes:normalize(h.name).includes(n)||n.includes(normalize(h.name))})).sort((a,b)=>Number(b.includes)-Number(a.includes)||a.d-b.d).slice(0,4);\n    return {error:'Nie mog\u0119 potwierdzi\u0107 konia \u201e'+cleanText(spoken)+'\u201d na li\u015bcie stajni. Nie przypisuj\u0119 \u017cadnego konia na podstawie domys\u0142\u00f3w. Zapytaj, czy chodzi o jedn\u0105 z propozycji, i popro\u015b o dok\u0142adn\u0105 nazw\u0119.',mozliwe_konie:candidates.map(x=>x.name)};\n  }\n  function checkCurrent(){if(!syncReady())return {error:'Brak potwierdzonej synchronizacji z Arkuszem Google. Nie zapisz\u0119 danych, dop\u00f3ki grafik si\u0119 nie zsynchronizuje.'};return null;}\n  function makeRide(a){const c=checkCurrent();if(c)return c;const rider=matchUnique(riders,a.jezdziec,'je\u017ad\u017aca'),horse=horseFromCatalog(a.kon),ins=matchUnique(instructors,a.instruktor,'instruktora');for(const x of [rider,horse,ins])if(x.error)return x;const date=String(a.data||''),time=String(a.godzina||'');if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(date)||!/^([01]\\d|2[0-3]):[0-5]\\d$/.test(time))return {error:'Podaj pe\u0142n\u0105 dat\u0119 YYYY-MM-DD i godzin\u0119 HH:MM.'};const d=new Date(date+'T12:00:00');if(!Number.isFinite(d.valueOf())||fmt(d)!==date)return {error:'Nieprawid\u0142owa data'};if(![...id(  ${['Pocz\u0105tkuj\u0105cy','\u015aredni','Zaawansowany'].includes(a.poziom)?a.poziom:'Pocz\u0105tkuj\u0105cy'}\\nTelefon: ${phone||'nie podano'}`};showPending();return {ok:true,informacja:pending.description,instrukcja:'Popro\u015b o klikni\u0119cie Potwierdzam zapis. Nie twierd\u017a, \u017ce zapis ju\u017c nast\u0105pi\u0142.'};}\n\n  const AI_DAYS=['Niedziela','Poniedzia\u0142ek','Wtorek','\u015aroda','Czwartek','Pi\u0105tek','Sobota'];\n  const AI_DAY_NUMBER={niedziela:0,poniedzialek:1,wtorek:2,sroda:3,czwartek:4,piatek:5,sobota:6};\n  const aiValidDate=x=>/^\\d{4}-\\d{2}-\\d{2}$/.test(String(x||''))&&fmt(new Date(x+'T12:00:00'))===x;\n  const aiRiderName=id=>riders.find(x=>x.id===id)?.name||'Nieznany je\u017adziec';\n  const aiHorseName=id=>horses.find(x=>x.id===id)?.name||'Nieznany ko\u0144';\n  const aiInstructorName=id=>instructors.find(x=>x.id===id)?.name||'Nieznany instruktor';\n  function aiGetGroups(a){\n    if(!syncReady())return {error:'Dane nie s\u0105 zsynchronizowane z Arkuszem Google.'};\n    const day=normalize(a.dzien||'wszystkie');\n    const n=Object.prototype.hasOwnProperty.call(AI_DAY_NUMBER,day)?AI_DAY_NUMBER[day]:null;\n    if(n===null&&!['wszystkie','wszystko','all',''].includes(day))return {error:'Nie rozpoznano dnia tygodnia.'};\n    const list=groups.filter(g=>n===null||Number(g.day)===n).slice().sort((a,b)=>((Number(a.day)+6)%7)-((Number(b.day)+6)%7)||normalizeTime(a.time).localeCompare(normalizeTime(b.time)));\n    return {dzien:n===null?'wszystkie':AI_DAYS[n],liczba_grup:list.length,grupy:list.map(g=>({nazwa:g.name,dzien:AI_DAYS[Number(g.day)]||'?',godzina:normalizeTime(g.time),instruktor:aiInstructorName(g.instructor),uczestnicy:(g.members||[]).map(aiRiderName)}))};\n  }\n  function aiBrowse(a){\n    if(!syncReady())return {error:'Dane nie s\u0105 zsynchronizowane z Arkuszem Google.'};\n    const k=a.kategoria,q=normalize(a.fraza||''),page=Math.max(1,Math.min(100,Math.floor(Number(a.strona)||1)));\n    if(k==='podsumowanie')return {jezdzcy:riders.length,konie:horses.length,instruktorzy:instructors.length,stale_grupy:groups.length,karnety_aktywne:passes.filter(p=>passState(p).active).length,karnety_do_zaplaty:passes.filter(p=>(p.paymentStatus||'paid')==='unpaid').length,jazdy:rides.length};\n    if(k==='cennik')return {cennik:{...priceSettings}};\n    if(k==='kontakt'){\n      if(!q)return {error:'Podaj imi\u0119 i nazwisko je\u017ad\u017aca, aby odczyta\u0107 telefon.'};\n      const r=matchUnique(riders,a.fraza,'je\u017ad\u017aca');if(r.error)return r;\n      return {jezdziec:r.value.name,telefon:r.value.phone||'Brak numeru'};\n    }\n    let all=[];\n    if(k==='jezdzcy')all=riders.map(r=>({jezdziec:r.name,poziom:r.level||'',aktywne_karnety:passes.filter(p=>p.rider===r.id&&passState(p).active).length}));\n    if(k==='konie')all=horses.map(h=>({kon:h.name,typ:h.type||''}));\n    if(k==='instruktorzy')all=instructors.map(i=>({instruktor:i.name,typ:i.type||'',odbyte_jazdy:rides.filter(r=>r.instructor===i.id&&r.status==='completed').length}));\n    if(k==='grupy')all=groups.map(g=>({grupa:g.name,dzien:AI_DAYS[Number(g.day)]||'?',godzina:normalizeTime(g.time),instruktor:aiInstructorName(g.instructor),uczestnicy:(g.members||[]).map(aiRiderName)}));\n    if(k==='karnety')all=passes.map(p=>({jezdziec:aiRiderName(p.rider),wszystkie:Number(p.total)||0,wykorzystane:Number(p.used)||0,pozostalo:Math.max(0,Number(p.total||0)-Number(p.used||0)),od:normalizeDate(p.start),do:normalizeDate(p.end),cena_zl:Number(p.price)||0,platnosc:(p.paymentStatus||'paid')==='paid'?'op\u0142acony':'do zap\u0142aty',aktywny:passState(p).active}));\n    if(k==='jazdy')all=rides.map(r=>({data:normalizeDate(r.date),godzina:normalizeTime(r.time),jezdziec:aiRiderName(r.rider),kon:r.horse?aiHorseName(r.horse):'Nieprzypisany',instruktor:aiInstructorName(r.instructor),grupa:groups.find(g=>g.id===r.group)?.name||'',rodzaj:r.type,status:r.status||'planned',stala:!!r.fixed,cena_zl:Number(r.price)||0}));\n    if(!['jezdzcy','konie','in nd;\n    const g=found.value,date=String(a.data||''),time=normalizeTime(g.time);\n    if(!aiValidDate(date)||new Date(date+'T12:00:00').getDay()!==Number(g.day))return {error:'Data nie pasuje do dnia tygodnia tej sta\u0142ej grupy.'};\n    if(date<fmt(new Date()))return {error:'Nie mo\u017cna doda\u0107 grupy na termin w przesz\u0142o\u015bci.'};\n    if(!instructors.some(i=>i.id===g.instructor))return {error:'Grupa nie ma przypisanego instruktora.'};\n    const members=(g.members||[]).map(id=>riders.find(r=>r.id===id)).filter(Boolean);\n    if(!members.length)return {error:'Brak je\u017ad\u017ac\u00f3w w tej sta\u0142ej grupie.'};\n    const assigns=Array.isArray(a.przypisania)?a.przypisania:[];\n    if(!assigns.length)return {pytanie:'Na jakich koniach b\u0119d\u0105 je\u017adzi\u0107 w TYM TYGODNIU? Powiedz osobno, kto jedzie i jakiego konia dostaje. Nie kopiuj poprzednich przydzia\u0142\u00f3w.',grupa:g.name,data:date,godzina:time,instruktor:aiInstructorName(g.instructor),uczestnicy:members.map(x=>x.name)};\n    if(assigns.length>members.length)return {error:'Wskazano wi\u0119cej je\u017ad\u017ac\u00f3w ni\u017c liczy grupa.'};\n    const selected=[];\n    for(const item of assigns){\n      const r=matchUnique(members,item.jezdziec,'uczestnika grupy');if(r.error)return r;\n      const h=horseFromCatalog(item.kon);if(h.error)return h;\n      if(selected.some(x=>x.riderId===r.value.id||x.horseId===h.value.id))return {error:'Ten sam ko\u0144 lub je\u017adziec jest wskazany dwa razy.'};\n      selected.push({riderId:r.value.id,riderName:r.value.name,horseId:h.value.id,horseName:h.value.name});\n    }\n    const occupied=rides.filter(r=>normalizeDate(r.date)===date&&normalizeTime(r.time)===time&&(r.status||'planned')!=='rescheduled');\n    if(occupied.some(r=>r.instructor===g.instructor))return {error:'Instruktor ma ju\u017c inn\u0105 jazd\u0119 w tej godzinie.'};\n    if(selected.some(x=>occupied.some(r=>r.rider===x.riderId||r.horse===x.horseId)))return {error:'Wybrany ko\u0144 lub je\u017adziec jest ju\u017c zaj\u0119ty.'};\n    const missing=members.filter(r=>!selected.some(x=>x.riderId===r.id)).map(x=>x.name);\n    pending={type:'group_schedule',groupId:g.id,date,time,instructorId:g.instructor,selected,description:'STA\u0141A GRUPA DO GRAFIKU\\nGrupa: '+g.name+'\\nData: '+date+', godz. '+time+'\\nInstruktor: '+aiInstructorName(g.instructor)+'\\n'+selected.map(x=>x.riderName+' \u2014 ko\u0144 '+x.horseName).join('\\n')+(missing.length?'\\nNie jad\u0105: '+missing.join(', '):'')+'\\nTylko ten termin. W kolejnym tygodniu zn\u00f3w zapytam o konie.'};\n    showPending();return {ok:true,podglad:pending.description,instrukcja:'Poczekaj na klikni\u0119cie POTWIERDZAM; nic nie zosta\u0142o jeszcze zapisane.'};\n  }\n\n  async function runTool(name,args){const a=args||{};\n    if(name==='sprawdz_stale_grupy')return aiGetGroups(a);\n    if(name==='przegladaj_dane_stajni')return aiBrowse(a);\n    if(name==='przygotuj_karnet')return aiMakePass(a);\n    if(name==='przygotuj_stala_grupe_do_grafiku')return aiMakeGroup(a);\n    if(name==='znajdz_w_stajni'){const li=a.kategoria==='jezdzcy'?riders:a.kategoria==='konie'?horses:instructors;return {nazwy:li.filter(x=>normalize(x.name).includes(normalize(a.fraza))).slice(0,12).map(x=>x.name)};}\n    if(name==='sprawdz_grafik'){const list=rides.filter(x=>normalizeDate(x.date)===a.data&&(!a.godzina||normalizeTime(x.time)===normalizeTime(a.godzina))).slice(0,40);return {liczba:list.length,jazdy:list.map(x=>({godzina:normalizeTime(x.time),jezdziec:riders.find(t=>t.id===x.rider)?.name||'?',kon:horses.find(t=>t.id===x.horse)?.name||'?',instruktor:instructors.find(t=>t.id===x.instructor)?.name||'?'}))};}\n    if(name==='pozostale_karnety'){const r=matchUnique(riders,a.jezdziec,'je\u017ad\u017aca');if(r.error)return r;return {jezdziec:r.value.name,karnety:passes.filter(p=>p.rider===r.value.id&&passState(p).active).map(p=>({pozostalo:Math.max(0,Number(p.total||0)-Number(p.used||0)),wazny_do:p.end||'',status_platnosci:p.paymentStatus||'paid'}))};}\n    if(name==='przygotuj_jazde')return makeRide(a);\n    if(name==='przygotuj_jezdzca')return makeRider(a);\n    return {error:'Nieznane polecenie'};\n  }\n  async function handleCall(c){\n    if(!c?.call_id||processed.has(c.call_id))return;\n    processed.add(c.call_id);\n    let output;\n    try{output=await runTool(c.name,JSON.parse(c.arguments||'{}'));}\n    catch(err){output={error:'Nie uda\u0142o si\u0119 wykona\u0107 polecenia: '+String(err?.message||err)};}\n    send({type:'conversation.item.create',item:{type:'function_call_output',call_id:c.call_id,output:JSON.stringify(output)}});\n  }\n  async function handleResponseDone(ev){\n    if(!ev?.response?.id||handledResponses.has(ev.response.id))return;\n    handledResponses.add(ev.response.id);\n    const calls=(ev.response.output||[]).filter(item=>item.type==='function_call');\n    if(!calls.length)return;\n    for(const call of calls)await handleCall(call);\n    if(dc?.readyState==='open')send({type:'response.create'});\n  }\n  id('siemowoAiConfirm').addEventListener('click',async()=>{\n    if(!pending)return;if(!id('siemowoAiEnableWrites').checked){tell('To tylko pr\u00f3ba \u2014 nie zapisano niczego. Po sprawdzeniu dzia\u0142ania zaznacz W\u0142\u0105cz prawdziwe zapisy, je\u015bli chcesz zapisa\u0107 t\u0119 propozycj\u0119.');return;}const p=pending;id('siemowoAiConfirm').disabled=true;try{\n      await loadAll(true);const check=checkCurrent();if(check)throw new Error(check.error);\n      if(p.type==='ride'){\n        if(!riders.some(x=>x.id===p.riderId)||!horses.some(x=>x.id===p.horseId)||!instructors.some(x=>x.id===p.instructorId))throw new Error('Zmieni\u0142y si\u0119 dane je\u017ad\u017aca, konia lub instruktora. Przygotuj zapis ponownie.');\n        if(rides.some(r=>normalizeDate(r.date)===p.date&&normalizeTime(r.time)===p.time&&(r.horse===p.horseId||r.rider===p.riderId)&&(r.status||'planned')!=='rescheduled'))throw new Error('Termin zosta\u0142 ju\u017c zaj\u0119ty. Przygotuj inny.');\n        const before=rides.length;openRideModal();id('rideDate').value=p.date;id('rideTime').value=p.time;id('rideType').value=p.kind;rideTypeChanged();id('rideRider').value=p.riderId;rideRiderChanged();id('rideHorse').value=p.horseId;id('rideInstructor').value=p.instructorId;id('ridePass').value='';id('rideCustomPrice').value=p.kind==='grupowa'?0:Number(priceSettings[p.kind]||0);await saveRide();if(rides.length<=before)throw new Error('Nie uda\u0142o si\u0119 utworzy\u0107 jazdy.');\n      }else if(p.type==='rider'){\n        if(riders.some(x=>normalize(x.name)===normalize(p.name)))throw new Error('Taki je\u017adziec ju\u017c istnieje.');\n        const before=riders.length;id('riderName').value=p.name;id('riderLevel').value=p.level;id('riderPhone').value=p.phone||'';id('riderEditId').value='';await addRider();if(riders.length<=before)throw new Error('Nie uda\u0142o si\u0119 doda\u0107 je\u017ad\u017aca.');\n      }else if(p.type==='pass'){\n        if(!riders.some(x=>x.id===p.riderId))throw new Error('Je\u017adziec nie istnieje ju\u017c w danych.');\n        if(passes.some(x=>x.rider===p.riderId&&Number(x.total)===p.total&&Number(x.price)===p.price&&normalizeDate(x.start)===p.start&&normalizeDate(x.end)===p.end))throw new Error('Identyczny karnet ju\u017c istnieje.');\n        const before=passes.length;\n        id('passRider').value=p.riderId;id('passTotal').value=String(p.total);id('passStart').value=p.start;id('passEnd').value=p.end;id('passPrice').value=String(p.price);id('passPayment').value=p.paymentStatus;id('passIncludePrevious').checked=false;\n        await addPass();\n        if(passes.length!==before+1)throw new Error('Nie uda\u0142o si\u0119 doda\u0107 karnetu.');\n      }else if(p.type==='group_schedule'){\n        const g=groups.find(x=>x.id===p.groupId);\n        if(!g||g.instructor!==p.instructorId||normalizeTime(g.time)!==p.time||Number(g.day)!==new Date(p.date+'T12:00:00').getDay())throw new Error('Dane grupy si\u0119 zmieni\u0142y; przygotuj j\u0105 ponownie.');\n        const allowed=new Set(g.members||[]),occ=rides.filter(r=>normalizeDate(r.date)===p.date&&normalizeTime(r.time)===p.time&&(r.status||'planned')!=='rescheduled');\n        if(occ.some(r=>r.instructor===p.instructorId))throw new Error('Instruktor ma ju\u017c inn\u0105 jazd\u0119 o tej godzinie.');\n        for(const x of p.selected)if(!allowed.has(x.riderId)||!horses.some(h=>h.id===x.horseId)||occ.some(r=>r.rider===x.riderId||r.horse===x.horseId))throw new Error('Zmieni\u0142 si\u0119 sk\u0142ad grupy lub dost\u0119pno\u015b\u0107 koni; przygotuj ponownie.');\n        const before=rides.length;\n        openGroupSchedule(g.id);\n        id('groupScheduleDate').value=p.date;id('groupScheduleInstructor').value=p.instructorId;id('groupScheduleFixed').value='true';\n        for(const row of document.querySelectorAll('#groupScheduleMembers .group-schedule-row')){\n          const riderId=row.querySelector('.group-going').dataset.rider,assignment=p.selected.find(x=>x.riderId===riderId);\n          row.querySelector('.group-going').checked=!!assignment;\n          row.querySelector('.group-horse').value=assignment?assignment.horseId:'';\n        }\n        await saveWholeGroup();\n        if(rides.length!==before+p.selected.length)throw new Error('Nie zapisano wszystkich jazd grupy. Sprawd\u017a grafik.');\n      }\n      pending=null;showPending();tell('\u2705 Zapis wys\u0142any do Arkusza Google. Sprawd\u017a, czy grafik zako\u0144czy\u0142 synchronizacj\u0119.');log('Potwierdzono: '+p.description.replace(/\\n/g,' \u2022 '));stop();\n    }catch(e){tell('Nie zapisano: '+String(e.message||e));}finally{id('siemowoAiConfirm').disabled=false;}\n  });\n  id('siemowoAiCancel').addEventListener('click',()=>{pending=null;showPending();tell('Propozycja anulowana.');});\n  id('siemowoAiText').addEventListener('keydown',e=>{if(e.key==='Enter')id('siemowoAiSend').click();});\n  id('siemowoAiSend').addEventListener('click',()=>{const text=cleanText(id('siemowoAiText').value);if(!text||dc?.readyState!=='open')return;id('siemowoAiText').value='';log('Ty: '+text);sayToAi(text);});\n  id('siemowoAiStop').addEventListener('click',()=>{stop();tell('Rozmowa zako\u0144czona.');});\n  id('siemowoAiClose').addEventListener('click',()=>{stop();id('siemowoAiPanel').style.display='none';});\n  btn.addEventListener('click',()=>{id('siemowoAiPanel').style.display='block';});\n  id('siemowoAiStart').addEventListener('click',async()=>{\n    if(busy)return;const password=id('siemowoAiSecret').value;\n    if(password.length<20){tell('Wpisz has\u0142o dost\u0119pu z Cloudflare (min. 20 znak\u00f3w).');return;}\n    if(!syncReady()){tell('Najpierw poczekaj na synchronizacj\u0119 grafiku z Arkuszem Google.');return;}\n    busy=true;id('siemowoAiStart').disabled=true;processed.clear();handledResponses.clear();tell('\u0141\u0105cz\u0119 si\u0119 z AI\u2026');\n    try{\n      const response=await fetch(WORKER+'/session',{method:'POST',mode:'cors',headers:{'Content-Type':'application/json','Authorization':'Bearer '+password},body:'{}',cache:'no-store'});\n      if(!response.ok){if(response.status===401||response.status===403){try{sessionStorage.removeItem(aiSessionSecretKey);}catch(_){ }id('siemowoAiSecret').value='';}const err=await response.json().catch(()=>({}));throw new Error(err.error||('Po\u0142\u0105czenie odrzucone: '+response.status));}\n      const token=await response.json();if(!token.value)throw new Error('Brak tymczasowego klucza g\u0142osowego.');if(id('siemowoAiRemember').checked){try{sessionStorage.setItem(aiSessionSecretKey,password);}catch(_){ }}else try{sessionStorage.removeItem(aiSessionSecretKey);}catch(_){ }\n      if(!navigator.mediaDevices?.getUserMedia||typeof RTCPeerConnection==='undefined')throw new Error('Przegl\u0105darka nie obs\u0142uguje rozmowy g\u0142osowej.');\n      pc=new RTCPeerConnection();pc.ontrack=evt=>{id('siemowoAiAudio').srcObject=evt.streams[0];id('siemowoAiAudio').play().catch(()=>tell('Po\u0142\u0105czono. Je\u015bli nie s\u0142ycha\u0107 g\u0142osu, naci\u015bnij \u25b6.'));};\n      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});stream.getTracks().forEach(track=>pc.addTrack(track,stream));\n      dc=pc.createDataChannel('oai-events');dc.addEventListener('open',()=>{\n        tell('\ud83c\udf99\ufe0f S\u0142ucham. Powiedz, co mam zrobi\u0107.');id('siemowoAiStop').disabled=false;id('siemowoAiSend').disabled=false;\n        const speechInstructions=[\n          'Jeste\u015b asystentk\u0105 organizacyjn\u0105 Stajni Siemowo. M\u00f3w WY\u0141\u0104CZNIE naturaln\u0105 polszczyzn\u0105, wyra\u017anie, spokojnie, bez obcego akcentowania imion; nazwy w\u0142asne wymawiaj starannie.',\n          'JESTE\u015a KONKRETNA: nie witaj si\u0119, nie dzi\u0119kuj, nie opowiadaj o swoich mo\u017cliwo\u015bciach. Ka\u017cda odpowied\u017a ma mie\u0107 najwy\u017cej JEDNO kr\u00f3tkie zdanie albo jedno konkretne pytanie. Gdy brakuje kilku danych, pytaj po kolei, po JEDNYM parametrze. Po odpowiedzi przejd\u017a do kolejnego kroku. Nigdy nie powtarzaj tego, co przed chwil\u0105 powiedzia\u0142a\u015b. Nie podsumowuj historii rozmowy. Nie wyg\u0142aszaj list uczestnik\u00f3w po kolei, je\u015bli nie prosz\u0105 o ca\u0142\u0105 list\u0119.',\n          'Dla ka\u017cdej pro\u015bby o odczyt danych u\u017cyj odpowiedniej funkcji. STA\u0141E GRUPY s\u0105 w zak\u0142adce Grupy i nie musz\u0105 by\u0107 zapisane w grafiku. Dzisiejsza data to '+fmt(new Date())+'. Niedziela jest wolna.',\n          'Zapisujesz tylko po przygotowaniu propozycji oraz klikni\u0119ciu przez u\u017cytkowniczk\u0119 Potwierdzam na ekranie. Nie m\u00f3w, \u017ce ju\u017c zapisano. Gdy przygotujesz propozycj\u0119, powiedz tylko: Sprawd\u017a dane na ekranie i kliknij Potwierdzam. Potem MILCZ i nie generuj nowych odpowiedzi do chwili nowego polecenia.',\n          'Sta\u0142e grupy: najpierw ustal dat\u0119 i grup\u0119, potem ZAWSZE zapytaj jakie konie maj\u0105 je\u017ad\u017acy W TYM TYGODNIU, nawet je\u015bli poprzednio je\u017adzili na innych. Nie wymy\u015blaj nazw ani przypisa\u0144. Gdy nazwa konia \u017ale rozpoznana, zapytaj kr\u00f3tko o poprawn\u0105 nazw\u0119. Nazw\u0119 konia wybieraj WY\u0141\u0104CZNIE z dok\u0142adnego katalogu, a nie z domys\u0142\u00f3w. Katalog koni: '+currentHorseNames().join(' | ')+'.',\n          'W razie niejasno\u015bci nazwiska, godziny, ko\u0144skiego imienia, ceny lub dnia pytaj ponownie. Nie pytaj o has\u0142a ani klucze. Zachowaj uprzejmy, ale rzeczowy ton.'\n        ].join(' ');\n        send({type:'session.update',session:{type:'realtime',tools,tool_choice:'auto',\n          max_output_tokens:640,\n          audio:{output:{voice:id('siemowoAiVoice').value||'shimmer',speed:1.0},input:{noise_reduction:{type:'far_field'},turn_detection:{type:'server_vad',threshold:0.55,prefix_padding_ms:300,silence_duration_ms:700,create_response:true,interrupt_response:false}}},\n          instructions:speechInstructions}});\n        // Bez automatycznego przywitania: asystentka czeka na polecenie.\n\n      });\n      dc.addEventListener('message',evt=>{try{\n        const ev=JSON.parse(evt.data);\n        if(ev.type==='output_audio_buffer.started'){playbackActive=true;micOn(false);}\n        if(ev.type==='output_audio_buffer.stopped'||ev.type==='output_audio_buffer.cleared'){playbackActive=false;micOn(true);}\n        if(ev.type==='response.done')void handleResponseDone(ev);\n        if(ev.type==='response.output_audio_transcript.done')log('Stajnia: '+String(ev.transcript||'').slice(0,500));\n        if(ev.type==='error')log('AI: '+String(ev.error?.message||'B\u0142\u0105d'));\n      }catch(err){console.warn('AI event',err);}});\n      const offer=await pc.createOffer();await pc.setLocalDescription(offer);const ans=await fetch('https://api.openai.com/v1/realtime/calls',{method:'POST',headers:{Authorization:'Bearer '+token.value,'Content-Type':'application/sdp'},body:offer.sdp});if(!ans.ok)throw new Error('Po\u0142\u0105czenie g\u0142osowe zosta\u0142o odrzucone ('+ans.status+').');await pc.setRemoteDescription({type:'answer',sdp:await ans.text()});\n      timer=setTimeout(()=>{stop();tell('Test zako\u0144czony po 3 minutach, \u017ceby ograniczy\u0107 koszty.');},180000);\n    }catch(err){stop();tell('Nie uda\u0142o si\u0119 po\u0142\u0105czy\u0107: '+String(err?.message||err)+'. Sprawd\u017a, czy serwer Cloudflare ma wgran\u0105 wersj\u0119 obs\u0142uguj\u0105c\u0105 po\u0142\u0105czenie z aplikacji.');}\n  });\n})();\n";
  const cacheKey = "siemowo_manager_original_html_pinned_v1";
  const msg = document.getElementById("loadingMsg");

  async function getOriginal() {
    // SZYBKI START: wykorzystaj zapisany kod bez czekania na sieć.
    // Sieć służy wyłącznie jako awaryjna ścieżka przy pierwszym uruchomieniu.
    try {
      const saved = localStorage.getItem(cacheKey);
      if (saved && saved.includes("function renderAll()") &&
          saved.includes("function saveRide()") &&
          saved.includes("Stajnia Siemowo Manager")) return saved;
    } catch (_) {}
    // Pierwsze uruchomienie: pobierz niezmienną, znaną wersję programu.
    // Nigdy nie pobieraj bieżącego index.html, bo to spowodowałoby zapętlenie.
    for (const url of sourceURLs) {
      try {
        const res = await fetch(url, {cache:"force-cache"});
        if (!res.ok) continue;
        const body = await res.text();
        if (!body.includes("Stajnia Siemowo Manager") ||
            !body.includes("function renderAll()") ||
            !body.includes("function saveRide()")) continue;
        try { localStorage.setItem(cacheKey, body); } catch (_) {}
        return body;
      } catch (_) {}
    }
    try {
      const saved = localStorage.getItem(cacheKey);
      if (saved && saved.includes("function renderAll()")) return saved;
    } catch (_) {}
    throw new Error("Nie udało się wczytać głównego programu. Sprawdź internet i odśwież stronę.");
  }

  try {
    const original = await getOriginal();
    // Rzadsze odświeżanie w tle. Zachowaj synchronizację po zapisaniu zmian
    // i po wznowieniu aplikacji (obsługuje to oryginalny program).
    const optimized = original.replace(
      "setInterval(()=>loadAll(),60000)",
      "setInterval(()=>{if(!document.hidden && navigator.onLine && !hasPending())loadAll()},180000)"
    );
    const endBody = optimized.toLowerCase().lastIndexOf("</body>");
    if (endBody === -1) throw new Error("Brak znacznika końca strony w programie.");
    const safeModule = voiceModule.replace(/<\/script/gi, "<\\/script");
    const scriptTag = "<scr" + "ipt>" + safeModule + "</scr" + "ipt>";
    const combined = optimized.slice(0,endBody) + "\n" + scriptTag + "\n" + optimized.slice(endBody);
    document.open();
    document.write(combined);
    document.close();
  } catch (error) {
    msg.textContent = error.message || "Błąd ładowania aplikacji.";
    msg.style.color = "#b91c1c";
    const btn = document.createElement("button");
    btn.textContent = "Spróbuj ponownie";
    btn.onclick = () => location.reload();
    msg.after(btn);
  }
})();
