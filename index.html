<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grafik Stajnia Siemowo</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f5f5f5;
color:#222;
}

header{
background:white;
padding:20px 16px;
position:sticky;
top:0;
z-index:10;
box-shadow:0 2px 8px #0002;
}

h1{
margin:0 0 15px;
font-size:26px;
}

.bar{
display:flex;
gap:8px;
flex-wrap:wrap;
}

button{
border:0;
border-radius:12px;
padding:12px 16px;
font-size:16px;
background:#222;
color:white;
}

.calendar{
overflow:auto;
padding:15px;
}

table{
border-collapse:collapse;
min-width:900px;
width:100%;
background:white;
}

th,td{
border:1px solid #ddd;
min-width:170px;
height:100px;
vertical-align:top;
padding:7px;
}

th{
height:60px;
background:#eee;
text-align:center;
}

.time{
min-width:65px;
width:65px;
font-weight:bold;
background:#fafafa;
}

.ride{
background:#eaf4e7;
border-left:5px solid #57905a;
border-radius:10px;
padding:8px;
margin-bottom:5px;
font-size:14px;
}

.ride strong{
font-size:18px;
}

.ride button{
padding:5px 9px;
font-size:12px;
margin-top:5px;
background:#777;
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:50;
align-items:center;
justify-content:center;
padding:15px;
}

.box{
background:white;
width:100%;
max-width:500px;
border-radius:20px;
padding:20px;
max-height:90vh;
overflow:auto;
}

.box h2{
margin-top:0;
}

label{
display:block;
font-weight:bold;
margin-top:12px;
}

input,select{
width:100%;
padding:13px;
margin-top:5px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
background:white;
}

.actions{
display:flex;
gap:10px;
justify-content:flex-end;
margin-top:20px;
}

.cancel{
background:#ddd;
color:#222;
}

.panel{
background:white;
margin:15px;
padding:18px;
border-radius:16px;
box-shadow:0 2px 8px #0002;
}

.riderRow{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0;
border-bottom:1px solid #eee;
}

.deleteRider{
background:#d33;
padding:5px 9px;
font-size:12px;
}
</style>
</head>

<body>

<header>

<h1>🐴 Grafik Stajnia Siemowo</h1>

<div class="bar">
<button onclick="previousDay()">← Poprzedni</button>
<button onclick="today()">Dziś</button>
<button onclick="nextDay()">Następny →</button>
<button onclick="openModal()">＋ Dodaj jazdę</button>
</div>

</header>

<div id="panel"></div>

<div class="calendar">

<table>

<thead>
<tr>
<th class="time">Godz.</th>
<th id="d0"></th>
<th id="d1"></th>
<th id="d2"></th>
<th id="d3"></th>
<th id="d4"></th>
</tr>
</thead>

<tbody id="calendarBody"></tbody>

</table>

</div>


<div class="modal" id="modal">

<div class="box">

<h2>🐴 Dodaj jazdę</h2>

<label>Data</label>
<input type="date" id="date">

<label>Godzina</label>
<input type="time" id="time" value="16:00">

<label>Jeździec</label>

<select id="rider">
<option value="">Wybierz jeźdźca</option>
</select>

<label>Koń</label>

<select id="horse">

<option value="">Wybierz konia</option>
<option>Klara</option>
<option>Klara siwa</option>
<option>Leipzig</option>
<option>Gayall</option>
<option>Cartaroni</option>
<option>Gwiazdka</option>
<option>Pretty</option>
<option>Mela</option>
<option>Lord</option>
<option>Tradycja</option>
<option>Hester</option>
<option>Stanislav</option>
<option>Bethoven</option>
<option>Goliat</option>
<option>Whyski</option>
<option>Fiona</option>
<option>Karuś</option>
<option>Filip</option>
<option>Kleo</option>
<option>Figaro</option>
<option>Tasiemka</option>
<option>Misty</option>
<option>Tiranas</option>
<option>Dioser</option>
<option>Equs</option>
<option>Tsunami</option>
<option>Viktor</option>
<option>Kobra</option>
<option>Amos</option>
<option>Zenek</option>
<option>Contici</option>
<option>Wicher</option>
<option>Igor</option>
<option>Lancaster</option>
<option>Ferrari</option>
<option>Gracek</option>
<option>Cono Corse</option>
<option>Sajan</option>

</select>

<label>Instruktor</label>

<input
id="instructor"
placeholder="Wpisz instruktora"
>

<div class="actions">

<button class="cancel" onclick="closeModal()">
Anuluj
</button>

<button onclick="saveRide()">
Zapisz
</button>

</div>

</div>
</div>


<script>

let currentDate = new Date();

let rides = JSON.parse(
localStorage.getItem("siemowoRides") || "[]"
);

let riders = JSON.parse(
localStorage.getItem("siemowoRiders") || "[]"
);


function keyDate(d){

return d.toISOString().split("T")[0];

}


function formatDate(d){

return d.toLocaleDateString("pl-PL",{
weekday:"short",
day:"2-digit",
month:"2-digit"
});

}


function render(){

for(let i=0;i<5;i++){

let d=new Date(currentDate);

d.setDate(d.getDate()+i);

document.getElementById("d"+i).textContent=
formatDate(d);

}


let body=document.getElementById("calendarBody");

body.innerHTML="";


for(let hour=8;hour<=20;hour++){

let tr=document.createElement("tr");

let time=document.createElement("td");

time.className="time";

time.textContent=
String(hour).padStart(2,"0")+":00";

tr.appendChild(time);


for(let day=0;day<5;day++){

let td=document.createElement("td");

let d=new Date(currentDate);

d.setDate(d.getDate()+day);

let date=keyDate(d);

let timeValue=
String(hour).padStart(2,"0")+":00";


let found=rides.filter(r=>
r.date===date &&
r.time===timeValue
);


found.forEach(r=>{

let div=document.createElement("div");

div.className="ride";

div.innerHTML=`
<strong>${r.time}</strong><br>
👤 ${escapeHtml(r.rider)}<br>
🐴 ${escapeHtml(r.horse)}<br>
👨‍🏫 ${escapeHtml(r.instructor || "-")}
<br>
<button onclick="removeRide('${r.id}')">
Usuń
</button>
`;

td.appendChild(div);

});


tr.appendChild(td);

}

body.appendChild(tr);

}

}


function openModal(){

document.getElementById("modal").style.display="flex";

document.getElementById("date").value=
keyDate(currentDate);

loadRiders();

}


function closeModal(){

document.getElementById("modal").style.display="none";

}


function loadRiders(){

let select=document.getElementById("rider");

select.innerHTML=
'<option value="">Wybierz jeźdźca</option>';

riders.forEach(name=>{

let option=document.createElement("option");

option.value=name;

option.textContent=name;

select.appendChild(option);

});

}


function saveRide(){

let date=
document.getElementById("date").value;

let time=
document.getElementById("time").value;

let rider=
document.getElementById("rider").value;

let horse=
document.getElementById("horse").value;

let instructor=
document.getElementById("instructor").value;


if(!date || !time || !rider || !horse){

alert(
"Uzupełnij datę, godzinę, jeźdźca i konia."
);

return;

}


rides.push({

id:Date.now().toString(),

date:date,

time:time,

rider:rider,

horse:horse,

instructor:instructor

});


localStorage.setItem(
"siemowoRides",
JSON.stringify(rides)
);


document.getElementById("instructor").value="";

document.getElementById("horse").value="";

closeModal();

render();

}


function removeRide(id){

if(!confirm("Usunąć tę jazdę?")) return;

rides=rides.filter(r=>r.id!==id);

localStorage.setItem(
"siemowoRides",
JSON.stringify(rides)
);

render();

}


function previousDay(){

currentDate.setDate(
currentDate.getDate()-1
);

render();

}


function nextDay(){

currentDate.setDate(
currentDate.getDate()+1
);

render();

}


function today(){

currentDate=new Date();

render();

}


function addRider(){

let input=
document.getElementById("newRider");

let name=input.value.trim();

if(!name) return;

if(!riders.includes(name)){

riders.push(name);

localStorage.setItem(
"siemowoRiders",
JSON.stringify(riders)
);

}

input.value="";

showPanel();

loadRiders();

}


function deleteRider(name){

if(!confirm("Usunąć jeźdźca "+name+"?"))
return;

riders=riders.filter(r=>r!==name);

localStorage.setItem(
"siemowoRiders",
JSON.stringify(riders)
);

showPanel();

loadRiders();

}


function showPanel(){

let panel=document.getElementById("panel");

panel.innerHTML=`

<div class="panel">

<h2>👤 Jeźdźcy Stajni Siemowo</h2>

<input
id="newRider"
placeholder="Wpisz imię i nazwisko jeźdźca"
>

<button
onclick="addRider()"
style="margin-top:10px;width:100%;"
>
＋ Dodaj jeźdźca
</button>

<div style="margin-top:15px;">

${
riders.length
?
riders.map(name=>`

<div class="riderRow">

<span>👤 ${escapeHtml(name)}</span>

<button
class="deleteRider"
onclick="deleteRider('${escapeHtml(name)}')"
>
Usuń
</button>

</div>

`).join("")
:
"<p>Nie ma jeszcze zapisanych jeźdźców.</p>"
}

</div>

</div>

`;

}


function escapeHtml(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


showPanel();

render();

</script>

</body>
</html>
