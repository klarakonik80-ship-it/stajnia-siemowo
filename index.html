<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grafik Stajnia Siemowo</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
}
header{
  background:white;
  padding:22px 16px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px #0001;
}
h1{margin:0 0 18px;font-size:28px}
.bar{display:flex;gap:10px;flex-wrap:wrap}
button{
  border:0;
  border-radius:14px;
  padding:14px 20px;
  font-size:17px;
  background:#222;
  color:white;
}
button:active{opacity:.7}
.calendar{
  overflow:auto;
  padding:18px;
}
table{
  border-collapse:collapse;
  min-width:900px;
  width:100%;
  background:white;
}
th,td{
  border:2px solid #ddd;
  min-width:180px;
  height:120px;
  vertical-align:top;
  padding:8px;
}
th{
  height:70px;
  background:#eee;
  text-align:center;
  font-size:17px;
}
.time{
  min-width:70px;
  width:70px;
  font-weight:bold;
  background:#fafafa;
}
.ride{
  background:#eaf4e7;
  border-left:6px solid #57905a;
  border-radius:12px;
  padding:10px;
  font-size:15px;
}
.ride strong{font-size:20px}
.ride button{
  padding:7px 12px;
  font-size:14px;
  margin-top:8px;
  background:#555;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.box{
  background:white;
  width:100%;
  max-width:500px;
  border-radius:22px;
  padding:24px;
}
.box h2{margin-top:0}
label{
  display:block;
  font-weight:bold;
  margin-top:14px;
}
input{
  width:100%;
  padding:14px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:17px;
}
.actions{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:22px;
}
.cancel{background:#ddd;color:#222}
</style>
</head>

<body>

<header>
<h1>🐴 Grafik Stajnia Siemowo</h1>

<div class="bar">
<button onclick="previousDay()">← Poprzedni</button>
<button onclick="today()">Dziś</button>
<button onclick="nextDay()">Następny →</button>
<button onclick="openModal()">＋ Dodaj jazdę</button>
</div>
</header>

<div class="calendar">
<table>
<thead>
<tr>
<th class="time">Godz.</th>
<th id="d0"></th>
<th id="d1"></th>
<th id="d2"></th>
<th id="d3"></th>
<th id="d4"></th>
</tr>
</thead>
<tbody id="calendarBody"></tbody>
</table>
</div>

<div class="modal" id="modal">
<div class="box">
<h2>Dodaj jazdę</h2>

<label>Data</label>
<input type="date" id="date">

<label>Godzina</label>
<input type="time" id="time" value="16:00">

<label>Jeździec</label>
<input type="text" id="rider" placeholder="Imię i nazwisko">

<label>Koń</label><select id="horse" style="width:100%;padding:14px;font-size:17px;border-radius:10px;">
<option value="">Wybierz konia</option>
<option>Klara</option>
<option>Klara siwa</option>
<option>Leipzig</option>
<option>Gayall</option>
<option>Cartaroni</option>
<option>Gwiazdka</option>
<option>Pretty</option>
<option>Mela</option>
<option>Lord</option>
<option>Tradycja</option>
<option>Hester</option>
<option>Stanislav</option>
<option>Bethoven</option>
<option>Goliat</option>
<option>Whyski</option>
<option>Fiona</option>
<option>Karuś</option>
<option>Filip</option>
<option>Kleo</option>
<option>Figaro</option>
<option>Tasiemka</option>
<option>Misty</option>
<option>Tiranas</option>
<option>Dioser</option>
<option>Equs</option>
<option>Tsunami</option>
<option>Viktor</option>
<option>Kobra</option>
<option>Amos</option>
<option>Zenek</option>
<option>Contici</option>
<option>Wicher</option>
<option>Igor</option>
<option>Lancaster</option>
<option>Ferrari</option>
<option>Gracek</option>
<option>Cono Corse</option>
<option>Sajan</option>
</select>

<label>Instruktor</label>
<input type="text" id="instructor" placeholder="Instruktor">

<div class="actions">
<button class="cancel" onclick="closeModal()">Anuluj</button>
<button onclick="saveRide()">Zapisz</button>
</div>

</div>
</div>

<script>
let currentDate=new Date();

let rides=JSON.parse(localStorage.getItem("siemowoRides")||"[]");

function keyDate(d){
  return d.toISOString().split("T")[0];
}

function formatDate(d){
  return d.toLocaleDateString("pl-PL",{
    weekday:"short",
    day:"2-digit",
    month:"2-digit"
  });
}

function render(){
  for(let i=0;i<5;i++){
    let d=new Date(currentDate);
    d.setDate(d.getDate()+i);
    document.getElementById("d"+i).innerHTML=
      formatDate(d);
  }

  let body=document.getElementById("calendarBody");
  body.innerHTML="";

  for(let hour=8;hour<=20;hour++){
    let tr=document.createElement("tr");

    let time=document.createElement("td");
    time.className="time";
    time.textContent=String(hour).padStart(2,"0")+":00";
    tr.appendChild(time);

    for(let day=0;day<5;day++){
      let td=document.createElement("td");

      let d=new Date(currentDate);
      d.setDate(d.getDate()+day);

      let date=keyDate(d);
      let timeValue=String(hour).padStart(2,"0")+":00";

      let found=rides.filter(r=>
        r.date===date && r.time===timeValue
      );

      found.forEach(r=>{
        let div=document.createElement("div");
        div.className="ride";

        div.innerHTML=`
        <strong>${r.time}</strong><br>
        👤 ${escapeHtml(r.rider)}<br>
        🐴 ${escapeHtml(r.horse)}<br>
        Instruktor: ${escapeHtml(r.instructor)}
        <br>
        <button onclick="removeRide('${r.id}')">Usuń</button>
        `;

        td.appendChild(div);
      });

      tr.appendChild(td);
    }

    body.appendChild(tr);
  }
}

function openModal(){
  document.getElementById("modal").style.display="flex";

  let d=new Date(currentDate);
  document.getElementById("date").value=keyDate(d);
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function saveRide(){
  let date=document.getElementById("date").value;
  let time=document.getElementById("time").value;
  let rider=document.getElementById("rider").value.trim();
  let horse=document.getElementById("horse").value.trim();
  let instructor=document.getElementById("instructor").value.trim();

  if(!date||!time||!rider||!horse){
    alert("Uzupełnij datę, godzinę, jeźdźca i konia.");
    return;
  }

  rides.push({
    id:Date.now().toString(),
    date,
    time,
    rider,
    horse,
    instructor
  });

  localStorage.setItem("siemowoRides",JSON.stringify(rides));

  document.getElementById("rider").value="";
  document.getElementById("horse").value="";
  document.getElementById("instructor").value="";

  closeModal();
  render();
}

function removeRide(id){
  if(!confirm("Usunąć tę jazdę?")) return;

  rides=rides.filter(r=>r.id!==id);
  localStorage.setItem("siemowoRides",JSON.stringify(rides));
  render();
}

function previousDay(){
  currentDate.setDate(currentDate.getDate()-1);
  render();
}

function nextDay(){
  currentDate.setDate(currentDate.getDate()+1);
  render();
}

function today(){
  currentDate=new Date();
  render();
}

function escapeHtml(text){
  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

render();

const konieSiemowo = [
"Klara","Klara siwa","Leipzig","Gayall","Cartaroni","Gwiazdka",
"Pretty","Mela","Lord","Tradycja","Hester","Stanislav","Bethoven",
"Goliat","Whyski","Fiona","Karuś","Filip","Kleo","Figaro","Tasiemka",
"Misty","Tiranas","Dioser","Equs","Tsunami",
"Viktor","Kobra","Amos","Zenek","Contici","Wicher","Igor",
"Lancaster","Ferrari","Gracek","Cono Corse","Sajan"
];

let jezdzcySiemowo = JSON.parse(
  localStorage.getItem("jezdzcySiemowo") || "[]"
);

function zapiszJezdzca(){
  const pole = document.getElementById("nowyJezdziec");
  const imie = pole.value.trim();

  if(!imie) return;

  if(!jezdzcySiemowo.includes(imie)){
    jezdzcySiemowo.push(imie);
    localStorage.setItem(
      "jezdzcySiemowo",
      JSON.stringify(jezdzcySiemowo)
    );
  }

  pole.value = "";
  pokazJezdzcow();
}

function pokazJezdzcow(){

  let panel = document.getElementById("panelSiemowo");

  if(!panel){
    panel = document.createElement("div");
    panel.id = "panelSiemowo";

    panel.style.cssText =
      "background:white;padding:18px;margin:16px;" +
      "border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.15);";

    document.body.insertBefore(panel, document.body.firstChild);
  }

  panel.innerHTML = `
    <h2>🐴 Konie Stajni Siemowo</h2>

    <select id="wybranyKon" style="
      width:100%;
      padding:14px;
      font-size:17px;
      border-radius:10px;
      margin-bottom:14px;
    ">
      ${konieSiemowo.map(k => `<option>${k}</option>`).join("")}
    </select>

    <h2>👤 Jeźdźcy</h2>

    <input
      id="nowyJezdziec"
      placeholder="Wpisz imię jeźdźca"
      style="
        width:100%;
        padding:14px;
        font-size:17px;
        border-radius:10px;
        border:1px solid #ccc;
      "
    >

    <button onclick="zapiszJezdzca()" style="
      width:100%;
      margin-top:10px;
    ">
      + Dodaj jeźdźca
    </button>

    <div style="margin-top:15px">
      ${
        jezdzcySiemowo.length
        ? jezdzcySiemowo.map(j => `<div>👤 ${j}</div>`).join("")
        : "<div>Nie ma jeszcze zapisanych jeźdźców.</div>"
      }
    </div>
  `;
}

pokazJezdzcow();
</script>
</body>
</html>
