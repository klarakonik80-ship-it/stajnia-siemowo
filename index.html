<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#166534">
<title>Stajnia Siemowo Manager — Hej, Stajnia!</title>
<style>
* {box-sizing:border-box}
body {font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f4f4;color:#222;margin:0}
main {max-width:580px;margin:16vh auto 0;padding:20px;text-align:center}
.panel {background:#fff;padding:26px 20px;border-radius:18px;box-shadow:0 4px 24px #0001}
p {line-height:1.55}
button {background:#166534;color:white;border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer}
.small {color:#666;font-size:13px}
</style>
</head>
<body>
<main>
<div class="panel">
<h2>🐴 Stajnia Siemowo Manager</h2>
<p>Uruchamiam aplikację z asystentem głosowym <strong>„Hej, Stajnia!”</strong>…</p>
<p id="loadingMsg" role="status" aria-live="polite">Wczytywanie grafiku, karnetów i koni…</p>
<p class="small">Przy pierwszym uruchomieniu potrzebne jest połączenie z internetem.</p>
</div>
</main>
<script>
(async function () {
  "use strict";
  const sourceURLs = ["https://raw.githubusercontent.com/klarakonik80-ship-it/stajnia-siemowo/88efd0589a974d8bca1a9356a6381889feae07e0/index.html", "https://cdn.jsdelivr.net/gh/klarakonik80-ship-it/stajnia-siemowo@88efd0589a974d8bca1a9356a6381889feae07e0/index.html"];
  const voiceModule = "/*\n * Stajnia Siemowo Manager — asystent głosowy (wersja testowa)\n * Instalacja: dodaj \u003cscript src=\"asystent-glosowy-stajnia-siemowo.js\">\u003c/script>\n * tuż przed \u003c/body> w istniejącym index.html, a plik umieść obok index.html.\n * Funkcja używa rozpoznawania mowy przeglądarki: nie nasłuchuje przy zamkniętej stronie.\n */\n(() => {\n  'use strict';\n  if (document.getElementById('siemowoVoicePanel')) return;\n  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;\n  const get = id => document.getElementById(id);\n  const clean = s => String(s || '').toLocaleLowerCase('pl-PL').normalize('NFD')\n    .replace(/[\\u0300-\\u036f]/g, '').replace(/ł/g, 'l').replace(/[^a-z0-9: ]/g, ' ')\n    .replace(/\\s+/g, ' ').trim();\n  const words = s => clean(s).split(' ').filter(Boolean);\n  const includesWord = (speech, token) => words(speech).some(w => w === token || (token.length >= 5 && w.startsWith(token.slice(0, 4))));\n  const nicknames = {\n    zofia: ['zosia','zosi','zosie','zofii'],\n    zuzanna: ['zuzia','zuzi','zuzie'],\n    julia: ['julia','julie','julii'],\n    natalia: ['natalia','natalie','natalii'],\n    aleksandra: ['ola','oli','ole'],\n    aleksander: ['olek','olka'],\n    katarzyna: ['kasia','kasi','kasie'],\n    malgorzata: ['gosia','gosi','gosie'],\n    anna: ['ania','ani','anie']\n  };\n  let pending = null;\n  let recog = null;\n  let listening = false;\n  let speechOn = true;\n\n  const css = document.createElement('style');\n  css.textContent = `\n    .sv-launch{background:#166534!important;display:inline-flex;align-items:center;gap:7px}\n    .sv-panel{display:none;position:fixed;inset:auto 12px 12px auto;z-index:250;width:min(430px,calc(100vw - 24px));\n      max-height:min(690px,85dvh);overflow:auto;background:#fff;color:#222;border-radius:19px;\n      box-shadow:0 10px 45px #0004;border:1px solid #ddd;padding:18px}\n    .sv-panel.open{display:block}\n    .sv-top{display:flex;align-items:center;justify-content:space-between;gap:10px}\n    .sv-top h3{margin:0;font-size:20px}\n    .sv-info{margin:10px 0;color:#666;font-size:13px;line-height:1.5}\n    .sv-answer{margin:12px 0;padding:12px;border-radius:12px;background:#f0f7f2;white-space:pre-wrap;line-height:1.5}\n    .sv-transcript{font-size:13px;color:#555;min-height:20px}\n    .sv-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}\n    .sv-actions button{flex:1}\n    .sv-inputrow{display:flex;gap:8px}.sv-inputrow input{min-width:0;flex:1}\n    .sv-inputrow button{white-space:nowrap}\n    .sv-examples{font-size:12px;color:#666;line-height:1.6;margin-top:10px}\n    .sv-close{padding:6px 12px;background:#777}\n    .sv-listening{background:#b91c1c!important}\n    @media(max-width:700px){.sv-panel{inset:auto 8px 8px 8px;width:auto;max-height:80dvh}}\n  `;\n  document.head.appendChild(css);\n\n  const launch = document.createElement('button');\n  launch.type = 'button';\n  launch.className = 'sv-launch';\n  launch.textContent = '🎙️ Hej, Stajnia';\n  launch.setAttribute('aria-label', 'Otwórz asystenta głosowego');\n  (document.querySelector('header .sync') || document.querySelector('header') || document.body).appendChild(launch);\n\n  const panel = document.createElement('section');\n  panel.id = 'siemowoVoicePanel';\n  panel.className = 'sv-panel';\n  panel.setAttribute('aria-label', 'Asystent głosowy Stajni Siemowo');\n  panel.innerHTML = `\n    \u003cdiv class=\"sv-top\">\u003ch3>🐴 Hej, Stajnia!\u003c/h3>\u003cbutton class=\"sv-close\" type=\"button\" id=\"svClose\">✕\u003c/button>\u003c/div>\n    \u003cp class=\"sv-info\">Naciśnij mikrofon i powiedz polecenie po polsku. Możesz zacząć od „Hej, Stajnia”.\n    Mikrofon działa tylko wtedy, gdy go włączysz, i tylko w otwartej aplikacji.\u003c/p>\n    \u003cdiv id=\"svTranscript\" class=\"sv-transcript\" aria-live=\"polite\">\u003c/div>\n    \u003cdiv id=\"svAnswer\" class=\"sv-answer\" role=\"status\" aria-live=\"polite\">Cześć! Możesz zapytać o grafik, konie, jeźdźców i karnety.\u003c/div>\n    \u003cdiv class=\"sv-actions\">\n      \u003cbutton class=\"green\" id=\"svMic\" type=\"button\">🎙️ Mów\u003c/button>\n      \u003cbutton class=\"gray\" id=\"svAudio\" type=\"button\" aria-pressed=\"true\">🔊 Głos: włączony\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"sv-inputrow\">\u003cinput id=\"svText\" aria-label=\"Wpisz polecenie\" placeholder=\"Albo wpisz polecenie…\">\n      \u003cbutton class=\"blue\" id=\"svSend\" type=\"button\">Wyślij\u003c/button>\u003c/div>\n    \u003cdiv class=\"sv-examples\">Przykłady: „Ile jazd zostało Zosi Tomczak?”, „Kto dzisiaj jeździ o 16?”,\n      „Pokaż niezapłacone karnety”, „Zapisz Julię jutro na 17 na Ferrari z Natalią”.\u003c/div>\n  `;\n  document.body.appendChild(panel);\n\n  const stopListening = () => {\n    if (recog) { try { recog.abort(); } catch (_) {} recog = null; }\n    listening = false;\n    get('svMic').textContent = '🎙️ Mów';\n    get('svMic').classList.remove('sv-listening');\n  };\n  const speak = text => {\n    if (!speechOn || !('speechSynthesis' in window)) return;\n    try {\n      window.speechSynthesis.cancel();\n      const utterance = new SpeechSynthesisUtterance(text);\n      utterance.lang = 'pl-PL'; utterance.rate = 0.96;\n      const polish = window.speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith('pl'));\n      if (polish) utterance.voice = polish;\n      window.speechSynthesis.speak(utterance);\n    } catch (err) { console.warn('Asystent: mowa niedostępna', err); }\n  };\n  const reply = (text, spokenText = text) => {\n    get('svAnswer').textContent = text;\n    speak(spokenText);\n  };\n  const pick = (entities, utterance) => {\n    const matches = entities.map(item => {\n      const parts = words(item.name);\n      const first = parts[0] || '';\n      const surname = parts.slice(1).join(' ');\n      const nameMatch = parts.length > 1 && clean(utterance).includes(parts.join(' '));\n      const firstVariants = [first, ...(nicknames[first] || [])];\n      const firstMatch = firstVariants.some(v => includesWord(utterance, v));\n      const surnameMatch = !!surname && surname.split(' ').some(v => includesWord(utterance, v));\n      const singleNameMatch = parts.length === 1 && firstMatch;\n      return {item, score: nameMatch ? 12 : (surnameMatch ? 6 : 0) + (firstMatch ? 3 : 0) + (singleNameMatch ? 2 : 0)};\n    }).filter(x => x.score > 0).sort((a,b) => b.score - a.score);\n    if (!matches.length) return {item:null, ambiguous:false};\n    const top = matches.filter(x => x.score === matches[0].score);\n    return {item:top.length === 1 ? top[0].item : null, ambiguous:top.length > 1,\n      options:top.slice(0,5).map(x => x.item.name)};\n  };\n  const who = (collection, sentence, label) => {\n    const result = pick(collection, sentence);\n    if (result.ambiguous) throw new Error(`Jest kilka pasujących osób lub koni: ${result.options.join(', ')}. Powiedz także nazwisko albo pełną nazwę.`);\n    return result.item;\n  };\n  const parseDate = sentence => {\n    const s = clean(sentence);\n    if (s.includes('pojutrze')) return fmt(addDays(new Date(),2));\n    if (s.includes('jutro')) return fmt(addDays(new Date(),1));\n    if (s.includes('dzis')) return fmt(new Date());\n    const weekday = ['niedziel','poniedzial','wtorek','srod','czwart','piat','sobot'];\n    const day = weekday.findIndex(name => s.includes(name));\n    if (day >= 0) { const now = new Date(); return fmt(addDays(now, ((day - now.getDay() + 7) % 7))); }\n    const numeric = sentence.match(/\\b(\\d{1,2})[.\\/-](\\d{1,2})(?:[.\\/-](\\d{4}))?\\b/);\n    if (numeric) {\n      const year = Number(numeric[3] || new Date().getFullYear());\n      const month = Number(numeric[2]), dayNum = Number(numeric[1]);\n      const dt = new Date(year, month-1, dayNum, 12);\n      if (dt.getFullYear()===year && dt.getMonth()===month-1 && dt.getDate()===dayNum) return fmt(dt);\n    }\n    return null;\n  };\n  const parseTime = sentence => {\n    let match = sentence.match(/\\b([01]?\\d|2[0-3])[:.]([0-5]\\d)\\b/);\n    if (match) return `${String(match[1]).padStart(2,'0')}:${match[2]}`;\n    match = clean(sentence).match(/\\b(?:o|na|godzina|godzinie|godz|godzine)\\s+([01]?\\d|2[0-3])\\b/);\n    if (match) return `${match[1].padStart(2,'0')}:00`;\n    return null;\n  };\n  const showRider = rider => { showPage('jezdzcy'); openRiderCard(rider.id); };\n  const passSummary = sentence => {\n    const rider = who(riders, sentence, 'jeździec');\n    if (!rider) return reply('Nie znalazłam jeźdźca. Powiedz jego imię i nazwisko.');\n    const pp = passes.filter(p => p.rider===rider.id && passState(p).active);\n    showRider(rider);\n    if (!pp.length) return reply(`${rider.name} nie ma obecnie aktywnego karnetu.`);\n    const left = pp.reduce((sum,p)=>sum+Math.max(0, Number(p.total||0)-Number(p.used||0)),0);\n    const unpaid = pp.some(p => (p.paymentStatus||'paid')==='unpaid');\n    reply(`${rider.name}: pozostało ${left} jazd na ${pp.length} aktywnych karnetach. ${unpaid?'Jest karnet do zapłaty.':'Karnety są oznaczone jako opłacone.'}`);\n  };\n  const unpaidPasses = () => {\n    const pp = passes.filter(p => passState(p).active && (p.paymentStatus||'paid')==='unpaid');\n    showPage('karnety');\n    if (!pp.length) return reply('Nie ma aktywnych karnetów oznaczonych jako nieopłacone.');\n    const names = pp.map(p => (riders.find(r=>r.id===p.rider)||{}).name || 'Nieznany jeździec');\n    const display = `Nieopłacone karnety (${pp.length}):\\n${names.map((n,i)=>`${i+1}. ${n}`).join('\\n')}`;\n    reply(display, `Są ${pp.length} nieopłacone karnety. ${names.slice(0,5).join(', ')}${names.length>5?'. Pełna lista na ekranie.':''}`);\n  };\n  const scheduleSummary = sentence => {\n    const date = parseDate(sentence) || fmt(new Date());\n    const time = parseTime(sentence);\n    const list = rides.filter(r=>normalizeDate(r.date)===date &&\n      (r.status||'planned')!=='rescheduled' && (!time || normalizeTime(r.time)===time))\n      .sort((a,b)=>normalizeTime(a.time).localeCompare(normalizeTime(b.time)));\n    currentDate = new Date(`${date}T12:00:00`); showPage('grafik'); renderSchedule();\n    if (!list.length) return reply(`Na ${date}${time?' o '+time:''} nie ma wpisanych jazd.`);\n    const summaries = list.map(r => {\n      const rider = riders.find(x => x.id === r.rider);\n      const instructor = instructors.find(x => x.id === r.instructor);\n      return `${normalizeTime(r.time)} – ${rider?rider.name:'Jeździec'}${instructor?' ('+instructor.name+')':''}`;\n    });\n    const head = `${date}${time?' o '+time:''}: ${list.length} zapisanych jazd.`;\n    reply(`${head}\\n${summaries.join('\\n')}`,\n      `${head} ${summaries.slice(0,6).join('. ')}${summaries.length>6?'. Pozostałe na ekranie.':''}`);\n  };\n  const horseSummary = sentence => {\n    const date = parseDate(sentence) || fmt(new Date());\n    const time = parseTime(sentence);\n    if (!time) return reply('Powiedz godzinę, na przykład: „Które konie są wolne jutro o 16?”');\n    const occupied = new Set(rides.filter(r => normalizeDate(r.date)===date && normalizeTime(r.time)===time &&\n      (r.status||'planned')!=='rescheduled').map(r=>r.horse));\n    const free = horses.filter(h => !occupied.has(h.id));\n    reply(`Na ${date} o ${time} wolne w grafiku (${free.length}): ${free.map(h=>h.name).join(', ') || 'brak'}.`,\n      `Na ${date} o ${time} jest ${free.length} wolnych koni w grafiku. ${free.slice(0,8).map(h=>h.name).join(', ')}.`);\n  };\n  const prepareRide = sentence => {\n    const rider = who(riders, sentence, 'jeździec');\n    const horse = who(horses, sentence, 'koń');\n    const instructor = who(instructors, sentence, 'instruktor');\n    const date = parseDate(sentence);\n    const time = parseTime(sentence);\n    pending = null;\n    showPage('grafik');\n    openRideModal();\n    if (date) get('rideDate').value = date;\n    if (time && [...get('rideTime').options].some(o=>o.value===time)) get('rideTime').value = time;\n    if (rider) { get('rideRider').value=rider.id; rideRiderChanged(); }\n    if (horse) get('rideHorse').value=horse.id;\n    if (instructor) get('rideInstructor').value=instructor.id;\n    const missing = [!rider?'jeździec':null,!horse?'koń':null,!instructor?'instruktor':null,\n      !date?'dzień':null,(!time || get('rideTime').value!==time)?'godzina dostępna w grafiku':null].filter(Boolean);\n    if (missing.length) return reply(`Przygotowałam formularz jazdy. Uzupełnij: ${missing.join(', ')}. Potem sprawdź dane i kliknij „Zapisz jazdę”.`);\n    const occupied = rides.some(r=>normalizeDate(r.date)===date && normalizeTime(r.time)===time &&\n      (r.status||'planned')!=='rescheduled' && (r.rider===rider.id || r.horse===horse.id));\n    if (occupied) return reply('Uwaga: jeździec lub koń ma już jazdę w tym terminie. Zmień termin albo konia. Niczego nie zapisałam.');\n    pending = {rider:rider.id,horse:horse.id,instructor:instructor.id,date,time};\n    reply(`Przygotowałam jazdę: ${rider.name}, ${date} o ${time}, koń ${horse.name}, instruktor ${instructor.name}. Sprawdź formularz. Powiedz „Potwierdzam” albo kliknij „Zapisz jazdę”.`);\n  };\n  const confirmRide = async () => {\n    if (!pending) return reply('Nie ma przygotowanej jazdy do potwierdzenia.');\n    const p = pending;\n    const modalVisible = get('rideModal').classList.contains('show');\n    if (!modalVisible || get('rideRider').value!==p.rider || get('rideHorse').value!==p.horse ||\n        get('rideInstructor').value!==p.instructor || get('rideDate').value!==p.date || get('rideTime').value!==p.time) {\n      pending=null;\n      return reply('Formularz został zmieniony. Sprawdź go i zapisz jazdę przyciskiem, żeby uniknąć pomyłki.');\n    }\n    pending=null;\n    const count = rides.length;\n    await saveRide();\n    reply(rides.length>count?'Jazda została dodana do grafiku.':'Nie udało się dodać jazdy. Sprawdź komunikat na ekranie.');\n  };\n  const handle = async raw => {\n    get('svTranscript').textContent = 'Usłyszałam: „' + raw + '”';\n    const sentence = clean(raw).replace(/^(hej )?stajni[aoe] ?/, '').trim();\n    if (!sentence) return reply('Słucham! Powiedz, co mam znaleźć lub wpisać.');\n    if (/^(anuluj|odwolaj|nie zapisuj|stop)$/.test(sentence)) { pending=null; return reply('Anulowałam polecenie. Niczego nie zapisałam.'); }\n    if (/^(potwierdzam|potwierdz|tak zapisz|tak potwierdzam)$/.test(sentence)) return confirmRide();\n    try {\n      if (/pomoc|co potrafisz|jakie polecenia/.test(sentence))\n        return reply('Potrafię znaleźć karnet jeźdźca, pokazać nieopłacone karnety, dzisiejszy grafik, wolne konie i przygotować zapis jazdy.');\n      if (/(niezaplacon|nieoplacon|do zaplaty)/.test(sentence) && /(karnet|platn)/.test(sentence)) return unpaidPasses();\n      if (/(zapisz|dopisz|umow|dodaj jazde|nowa jazda)/.test(sentence)) return prepareRide(raw);\n      if (/(wolne|dostepne)/.test(sentence) && /(konie|kon|koni)/.test(sentence)) return horseSummary(raw);\n      if (/(karnet|ile jazd|pozostal|zostalo)/.test(sentence)) return passSummary(raw);\n      if (/(kto|grafik|jazdy|jezdzi|zaplanowane)/.test(sentence)) return scheduleSummary(raw);\n      if (/(znajdz|wyszukaj|pokaz|karta)/.test(sentence)) {\n        const rider=who(riders,raw,'jeździec');\n        if (rider) { showRider(rider); return reply(`Otworzyłam kartę jeźdźca: ${rider.name}.`); }\n        return reply('Nie znalazłam tej osoby. Podaj imię i nazwisko.');\n      }\n      reply('Nie zrozumiałam tego polecenia. Powiedz „Pomoc”, aby usłyszeć przykłady.');\n    } catch (err) { reply(err && err.message ? err.message : 'Nie udało się wykonać polecenia.'); }\n  };\n  const startMic = () => {\n    if (listening) { stopListening(); return; }\n    if (!SpeechRecognition) return reply('Ta przeglądarka nie udostępnia rozpoznawania mowy. Możesz użyć mikrofonu na klawiaturze iPhone’a w polu tekstowym lub wpisać polecenie.');\n    try {\n      if ('speechSynthesis' in window) window.speechSynthesis.cancel();\n      recog = new SpeechRecognition();\n      recog.lang = 'pl-PL'; recog.interimResults=false; recog.continuous=false; recog.maxAlternatives=1;\n      const session = recog;\n      recog.onresult = e => {\n        if (recog !== session) return;\n        const phrase=e.results[0][0].transcript;\n        recog=null; listening=false;\n        get('svMic').textContent='🎙️ Mów'; get('svMic').classList.remove('sv-listening');\n        void handle(phrase);\n      };\n      recog.onerror = e => {\n        if (recog !== session) return;\n        stopListening();\n        const msg = e.error==='not-allowed'?'Zezwól przeglądarce na używanie mikrofonu.':\n          e.error==='no-speech'?'Nie usłyszałam polecenia. Spróbuj ponownie.':\n          'Nie udało się rozpoznać mowy. Spróbuj ponownie lub wpisz polecenie.';\n        get('svAnswer').textContent=msg;\n      };\n      recog.onend = () => {\n        if (recog !== session) return;\n        recog=null; listening=false;\n        get('svMic').textContent='🎙️ Mów'; get('svMic').classList.remove('sv-listening');\n      };\n      recog.start(); listening=true;\n      get('svMic').textContent='⏹ Zatrzymaj'; get('svMic').classList.add('sv-listening');\n      get('svTranscript').textContent='Słucham…';\n    } catch (err) { stopListening(); reply('Nie udało się włączyć mikrofonu. Sprawdź uprawnienia przeglądarki.'); }\n  };\n  launch.addEventListener('click', () => { panel.classList.toggle('open'); if (!panel.classList.contains('open')) stopListening(); });\n  get('svClose').addEventListener('click', () => {panel.classList.remove('open'); stopListening();});\n  get('svMic').addEventListener('click', startMic);\n  get('svAudio').addEventListener('click', () => {\n    speechOn=!speechOn;\n    get('svAudio').textContent=speechOn?'🔊 Głos: włączony':'🔇 Głos: wyłączony';\n    get('svAudio').setAttribute('aria-pressed',String(speechOn));\n    if (!speechOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();\n  });\n  const submitText = () => { const text=get('svText').value.trim(); if(text) {get('svText').value=''; void handle(text);} };\n  get('svSend').addEventListener('click',submitText);\n  get('svText').addEventListener('keydown',event=>{if(event.key==='Enter')submitText();});\n})();\n";
  const cacheKey = "siemowo_manager_original_html_pinned_v1";
  const msg = document.getElementById("loadingMsg");

  async function getOriginal() {
    // Pinned, preserved source. Never fetch this site's new index.html.
    for (const url of sourceURLs) {
      try {
        const res = await fetch(url, {cache:"force-cache"});
        if (!res.ok) continue;
        const body = await res.text();
        if (!body.includes("Stajnia Siemowo Manager") ||
            !body.includes("function renderAll()") ||
            !body.includes("function saveRide()")) continue;
        try { localStorage.setItem(cacheKey, body); } catch (_) {}
        return body;
      } catch (_) {}
    }
    try {
      const saved = localStorage.getItem(cacheKey);
      if (saved && saved.includes("function renderAll()")) return saved;
    } catch (_) {}
    throw new Error("Nie udało się wczytać głównego programu. Sprawdź internet i odśwież stronę.");
  }

  try {
    const original = await getOriginal();
    const endBody = original.toLowerCase().lastIndexOf("</body>");
    if (endBody === -1) throw new Error("Brak znacznika końca strony w programie.");
    const safeModule = voiceModule.replace(/<\/script/gi, "<\\/script");
    const scriptTag = "<scr" + "ipt>" + safeModule + "</scr" + "ipt>";
    const combined = original.slice(0,endBody) + "\n" + scriptTag + "\n" + original.slice(endBody);
    document.open();
    document.write(combined);
    document.close();
  } catch (error) {
    msg.textContent = error.message || "Błąd ładowania aplikacji.";
    msg.style.color = "#b91c1c";
    const btn = document.createElement("button");
    btn.textContent = "Spróbuj ponownie";
    btn.onclick = () => location.reload();
    msg.after(btn);
  }
})();
</script>
</body>
</html>
